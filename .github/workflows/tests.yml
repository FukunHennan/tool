name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 出行地图 · 接口与存储测试
        working-directory: projects/travel
        run: |
          python -m unittest discover -s tests -v
          node --test tests/storage.test.cjs

      - name: PCB 物料柜 · 单元测试与构建
        working-directory: projects/pcb-cabinet
        run: |
          npm ci
          npm test
          npm run build

      - name: ESP32 烧录器 · 单元测试与构建
        working-directory: projects/esp-flasher
        run: |
          npm ci
          npm test
          npm run build

      - name: 串口助手 · 桥接与逻辑层测试
        working-directory: projects/serial
        run: |
          python -m pip install pyserial
          python -m unittest discover -s tests
          cd web && node --test
