<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加西湖一日游</title><link rel="stylesheet" href="style.css?v=6"><body style="max-width:640px;margin:40px auto;padding:20px"><h1>添加西湖一日游</h1><p>合并到当前浏览器的地点记录，不替换同伴位置和地图配置。</p><div id="status" role="status">正在检查地图配置…</div><ol id="results"></ol><a class="button primary" href="./">返回出游地图</a><button id="retry" hidden onclick="location.reload()">重试未添加的地点</button><script>
'use strict';
const itinerary=[['黄龙体育中心','浙江省黄龙体育中心','10:30 集合；11:00 附近午餐。可在「集合安排」中将这里设为集合点。'],['曲院风荷','曲院风荷','12:00–13:30 沿湖散步、拍照。'],['北山街','北山街','13:30–15:00 沿街往东散步；标点为街道参考位置。'],['孤山','孤山公园','15:00–16:00 与平湖秋月一起游览；以孤山的中山公园为参考点，怕累可略过内部游览。'],['平湖秋月','平湖秋月','15:00–16:00 看湖景、休息；以平湖秋月碑亭为参考点。'],['白堤','白堤','16:00–17:00 沿白堤向断桥方向步行；标点为步道参考位置。'],['断桥','断桥残雪','16:00–17:00 拍照后往湖滨方向走。'],['湖滨商圈','湖滨银泰in77','17:00 后在湖滨商圈晚餐；以湖滨银泰 in77 作为商圈参考点。']];
const status=document.getElementById('status'),list=document.getElementById('results');
const norm=s=>String(s).replace(/[\s·（）()]/g,'');
function sdk(c){return new Promise((resolve,reject)=>{window._AMapSecurityConfig={securityJsCode:c.code};const script=document.createElement('script');script.src='https://webapi.amap.com/maps?v=2.0&plugin=AMap.PlaceSearch&key='+encodeURIComponent(c.key);const timer=setTimeout(()=>reject(Error('高德加载超时，请稍后重试')),20000);script.onload=()=>{clearTimeout(timer);window.AMap?resolve():reject(Error('高德加载失败'))};script.onerror=()=>{clearTimeout(timer);reject(Error('无法连接高德'))};document.head.append(script)})}
function search(query){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('查询超时')),12000);new AMap.PlaceSearch({city:'杭州',citylimit:true,pageSize:10}).search(query,(s,r)=>{clearTimeout(timer);if(s!=='complete'){reject(Error('未找到地点或查询受限'));return}const all=(r.poiList?.pois||[]).filter(p=>p.location&&p.location.lng>119.9&&p.location.lng<120.3&&p.location.lat>30.1&&p.location.lat<30.4);const canonical={'曲院风荷':'杭州西湖风景名胜区-曲院风荷','孤山公园':'中山公园','平湖秋月':'平湖秋月碑亭','白堤':'杭州西湖风景名胜区-白堤','断桥残雪':'杭州西湖风景名胜区-断桥残雪'};const chosen=all.filter(p=>p.name===canonical[query]);if(chosen.length===1){resolve(chosen[0]);return}const main=all.filter(p=>!/(停车|入口|出口|门票|售票|厕所|公交|地铁|酒店|饭店|餐厅|码头|[东南西北]门|咖啡|便利店)/.test(p.name)&&norm(p.name).includes(norm(query)));if(main.length===1){resolve(main[0]);return}const exact=all.filter(p=>norm(p.name)===norm(query));if(exact.length===1){resolve(exact[0]);return}if(all.length===1){resolve(all[0]);return}reject(Error('多个候选：'+all.map(p=>p.name).join('、')))})})}
(async()=>{try{const config=JSON.parse(localStorage.getItem('travel-map-config')||'{}');if(!config.key||!config.code)throw Error('此地址下未保存地图配置，请先返回地图勾选记住配置，再打开本页');const backend=await fetch('/api/state').then(r=>{if(!r.ok)throw Error('请先启动后端');return r.json()});let revision=backend.revision;if(revision>0)localStorage.setItem('travel-points',JSON.stringify(backend.state.points));await sdk(config);let added=0,skipped=0,failed=0;for(const [name,query,note] of itinerary){const li=document.createElement('li');list.append(li);li.textContent=name+'：正在查询…';try{let points=JSON.parse(localStorage.getItem('travel-points')||'[]');if(!Array.isArray(points))throw Error('现有地点格式异常，已停止修改');let existing=points.find(p=>p.routeStop===name||norm(p.name).includes(norm(name))||norm(p.name).includes(norm(query)));if(existing){skipped++;li.textContent=name+'：已有记录，已保留';continue}const poi=await search(query);points=JSON.parse(localStorage.getItem('travel-points')||'[]');if(!Array.isArray(points))throw Error('现有记录格式异常');existing=points.find(p=>p.routeStop===name||norm(p.name).includes(norm(name))||norm(p.name).includes(norm(query)));if(existing){skipped++;li.textContent=name+'：已有记录，已保留';continue}points.push({id:crypto.randomUUID(),name,type:'spot',color:'#13876b',address:[poi.cityname,poi.adname,typeof poi.address==='string'?poi.address:''].filter(Boolean).join(' ').slice(0,200),lng:Number(poi.location.lng),lat:Number(poi.location.lat),note:note+' 时间为建议安排，可自行调整。',routeStop:name,updated:Date.now()});const write=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state:{points,city:backend.state.city||'杭州',meeting:backend.state.meeting||{}}})});const saved=await write.json();if(!write.ok)throw Error(saved.error||'后端保存失败');revision=saved.revision;localStorage.setItem('travel-points',JSON.stringify(points));added++;li.textContent=name+'：已添加'}catch(e){failed++;li.textContent=name+'：'+e.message}}status.textContent=`新增 ${added} 个，保留已有 ${skipped} 个，未添加 ${failed} 个。返回地图后刷新，即可查看。`;document.getElementById('retry').hidden=failed===0;const report=new Image();report.src='/favicon.ico?itinerary_added='+added+'&existing='+skipped+'&failed='+failed;}catch(e){status.textContent=e.message;document.getElementById('retry').hidden=false}})();
</script></body></html>
