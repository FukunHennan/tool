<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="浏览器串口调试：参数配置、HEX/文本收发、日志搜索与统计。">
<title>串口助手 · Web Serial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="back" href="/">← 工具目录</a>
  <h1>串口助手</h1>
  <span class="chip">Web Serial</span>
  <span class="spacer"></span>
  <span id="status" class="status">未连接</span>
</header>

<main>
  <!-- 左：串口配置 -->
  <aside class="panel" id="config-panel">
    <h2>串口配置 <span class="lock" id="lock">🔓</span></h2>

    <button id="pick" class="wide">选择串口…</button>
    <div id="port-name" class="port-name">未选择端口</div>

    <div class="field">
      <span>波特率</span>
      <input id="baud" type="number" min="300" max="4000000" step="1" list="bauds" value="115200">
      <datalist id="bauds"></datalist>
    </div>

    <div class="field"><span>数据位</span><div class="seg" id="data-bits"></div></div>
    <div class="field"><span>校验</span><div class="seg" id="parity"></div></div>
    <div class="field"><span>停止位</span><div class="seg" id="stop-bits"></div></div>
    <div class="field"><span>流控</span><div class="seg" id="flow"></div></div>

    <div class="field">
      <button id="connect" class="wide primary">连接 (o)</button>
    </div>
    <div class="hint" id="config-hint">连接后配置自动锁定，断开解锁。</div>
  </aside>

  <!-- 中：消息日志 -->
  <section class="panel log">
    <div class="log-toolbar">
      <span class="title">消息</span>
      <button id="hex-toggle" title="HEX / TEXT 显示切换 (x)">TEXT</button>
      <span id="count" class="dim mono">0 条</span>
      <input id="search" type="search" placeholder="搜索…（f）" autocomplete="off">
      <label><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
      <button id="clear" title="清空日志 (c)">清空</button>
      <button id="copy" title="复制当前日志">复制</button>
    </div>
    <div id="log" class="log-body" aria-live="polite"></div>
    <div id="empty" class="log-empty">
      日志为空<br>点击左侧「选择串口…」授权端口后按 o 连接
    </div>
  </section>

  <!-- 右：行尾追加 -->
  <aside class="panel append">
    <h2>行尾追加</h2>
    <div class="seg vertical" id="append"></div>
    <div class="hint">按 n 循环</div>
  </aside>
</main>

<!-- 底部：发送 -->
<footer class="sendbar">
  <span id="tx-mode" class="modepill" title="点击或按 ↑↓ 切换 HEX / ASCII 发送">ASCII</span>
  <input id="tx" type="text" placeholder="输入要发送的内容，Enter 发送" autocomplete="off">
  <button id="send" class="primary">发送</button>
  <div id="stats" class="stats mono">TX 0 B / 0 · RX 0 B / 0</div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
