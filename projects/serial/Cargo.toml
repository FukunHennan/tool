[workspace]
resolver = "2"
members = [
    "crates/pctoolbox-core",
    "crates/pctoolbox-serial",
    "crates/pctoolbox-esp",
    "crates/pctoolbox-analyzer",
    "crates/pctoolbox-plugin",
    "crates/pctoolbox-ui",
    "crates/pctoolbox-cli",
    "crates/pctoolbox-eventbus",
    "crates/pctoolbox-storage",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["pctoolbox"]

[workspace.dependencies]
pctoolbox-core = { path = "crates/pctoolbox-core" }
pctoolbox-serial = { path = "crates/pctoolbox-serial" }
pctoolbox-esp = { path = "crates/pctoolbox-esp" }
pctoolbox-analyzer = { path = "crates/pctoolbox-analyzer" }
pctoolbox-plugin = { path = "crates/pctoolbox-plugin" }
pctoolbox-ui = { path = "crates/pctoolbox-ui" }
pctoolbox-eventbus = { path = "crates/pctoolbox-eventbus" }
pctoolbox-storage = { path = "crates/pctoolbox-storage" }

# 统一依赖版本
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serialport = "4"
