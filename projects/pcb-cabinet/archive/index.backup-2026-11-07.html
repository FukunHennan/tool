  function renderGrid() {
    const zone = Store.zone;
    const counts = zone.rowCounts;
    const maxCols = Math.max(1, maxColsOf(counts));
    els.grid.style.setProperty('--cols', maxCols);
    const frag = document.createDocumentFragment();

    /* 左上角占位（行标列与列标行交叉处，不遮挡内容） */
    const corner = document.createElement('span');
    corner.className = 'axis-corner';
    corner.setAttribute('aria-hidden', 'true');
    frag.appendChild(corner);

    /* 顶部列标：始终按最大列数铺满，某排格数不足时对应位置仍保留列标 */
    for (let c = 0; c < maxCols; c++) {
      const col = document.createElement('span');
      col.className = 'axis-label axis-col';
      col.dataset.col = String(c + 1);
      col.textContent = String(c + 1);
      frag.appendChild(col);
    }

    counts.forEach((n, r) => {
      const row = document.createElement('span');
      row.className = 'axis-label axis-row';
      row.dataset.row = String(r + 1);
      row.textContent = rowLetter(r);
      frag.appendChild(row);
      for (let c = 0; c < maxCols; c++) {
        if (c < n) {
          const id = labelAt(r, c);
          frag.appendChild(cellNode(id, Store.getCell(id)));
        } else {
          const gap = document.createElement('span');
          gap.className = 'cell-gap';
          gap.setAttribute('aria-hidden', 'true');
          frag.appendChild(gap);
        }
      }
    });

    els.grid.innerHTML = '';
    els.grid.appendChild(frag);
    syncAxisHighlight();
  }

  /* 格位编号 → 行列：A1 = 第 1 行第 1 列 */
  function axisOf(id) {
    const m = /^([A-Z])(\d+)$/.exec(String(id || ''));
    if (!m) return null;
    return { row: m[1].charCodeAt(0) - 64, col: parseInt(m[2], 10) };
  }

  function cellPosText(id) {
    const pos = axisOf(id);
    return pos ? '（第 ' + pos.row + ' 行第 ' + pos.col + ' 列）' : '';
  }

  /* 选中格 / 搜索命中格对应的行标、列标同步高亮 */
  function syncAxisHighlight() {
    const rows = new Set();
    const cols = new Set();
    els.grid.querySelectorAll('.cell.hit, .cell.locate').forEach(function (node) {
      const pos = axisOf(node.dataset.id);
      if (pos) { rows.add(pos.row); cols.add(pos.col); }
    });
    if (ui.currentId) {
      const pos = axisOf(ui.currentId);
      if (pos) { rows.add(pos.row); cols.add(pos.col); }
    }
    els.grid.querySelectorAll('.axis-row').forEach(function (node) {
      node.classList.toggle('hit', rows.has(parseInt(node.dataset.row, 10)));
    });
    els.grid.querySelectorAll('.axis-col').forEach(function (node) {
      node.classList.toggle('hit', cols.has(parseInt(node.dataset.col, 10)));
    });
  }

  /* ---------------- 6.5 紧凑网格：等比格 + 固定间距 + 左上对齐 ---------------- */
  const ZOOM_BASE_W = 96;    // 基准格宽
  const ZOOM_BASE_H = 88;    // 基准格高（宽高比约 1.09，始终等比）
  const ZOOM_MIN_W = 76;     // 可读性下限：格宽
  const ZOOM_MIN_H = 56;     // 可读性下限：格高
  const ZOOM_MAX_W = 120;    // 格宽上限
  const ZOOM_MAX_H = 110;    // 格高上限
  const FIXED_MIN_W = 76;    // 固定尺寸档：滑块下限
  const FIXED_MAX_W = 220;   // 固定尺寸档：滑块上限
  const ZOOM_MIN_SCALE = Math.max(ZOOM_MIN_W / ZOOM_BASE_W, ZOOM_MIN_H / ZOOM_BASE_H);
  const ZOOM_MAX_SCALE = Math.min(ZOOM_MAX_W / ZOOM_BASE_W, ZOOM_MAX_H / ZOOM_BASE_H);
  let zoomRaf = 0;

  /* 按格宽 / 格高决定信息层级：120×110 为 lg（编号+名称+型号+数量+状态） */
  function zoomBandOf(w, h) {
    if (w >= 108 && h >= 100) return 'lg';
    if (w >= 88 && h >= 78) return 'md';
    if (w >= 64 && h >= 52) return 'sm';
    return 'xs';
  }

  function setZoomTip(on) {
    if (!els.zoomHint) return;
    if (els.zoomHint.classList.contains('show') === on) return;
    els.zoomHint.textContent = on ? '已达最小可读尺寸，可滚动查看' : '';
    els.zoomHint.classList.toggle('show', on);
  }

  /* 紧凑网格：格子等比缩放并封顶 120×110；间距固定（桌面 12 / 窄屏 6）；
     网格左上对齐，剩余空间留在右下角，不再摊进间距、不再居中
     总量 = 左侧行标 + 列数×格宽 + 列数×间距，纵向同理 */
  function applyZoom() {
    if (!Store.state || !els.cabinetInner) return;
    const inner = els.cabinetInner;
    const grid = els.grid;
    const zone = Store.zone;
    const cols = Math.max(1, maxColsOf(zone.rowCounts));
    const rows = Math.max(1, zone.rowCounts.length);
    const narrow = window.matchMedia('(max-width: 720px)').matches;
    const labelW = narrow ? 28 : 32;
    const labelH = 22;
    const gap = narrow ? 6 : 12;   // 固定间距档位，不随剩余空间变化

    const cs = getComputedStyle(inner);
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const availW = Math.max(120, inner.clientWidth - padX);
    const availH = Math.max(120, inner.clientHeight - padY);

    let cellW; let cellH;

    if (ui.zoomMode === 'fixed') {
      cellW = Math.min(FIXED_MAX_W, Math.max(FIXED_MIN_W, Math.floor(ui.fixedW)));
      cellH = Math.max(ZOOM_MIN_H, Math.floor(cellW * ZOOM_BASE_H / ZOOM_BASE_W));
    } else {
      /* 等比缩放：可用区域内能放下的最大比例，夹在可读下限与 120×110 上限之间 */
      const fitW = (availW - labelW - cols * gap) / (cols * ZOOM_BASE_W);
      const fitH = (availH - labelH - rows * gap) / (rows * ZOOM_BASE_H);
      const s = Math.min(Math.max(ZOOM_MIN_SCALE, Math.min(fitW, fitH)), ZOOM_MAX_SCALE);
      cellW = Math.max(ZOOM_MIN_W, Math.floor(ZOOM_BASE_W * s));
      cellH = Math.max(ZOOM_MIN_H, Math.floor(ZOOM_BASE_H * s));
    }

    inner.style.setProperty('--cell-w', cellW + 'px');
    inner.style.setProperty('--cell-h', cellH + 'px');
    inner.style.setProperty('--cell-gap-x', gap + 'px');
    inner.style.setProperty('--cell-gap-y', gap + 'px');
    inner.style.setProperty('--rlabel', (narrow ? 28 : 32) + 'px');
    inner.style.setProperty('--clabel', labelH + 'px');
    /* 左上对齐：清掉旧的居中留白 */
    grid.style.marginLeft = '0px';
    grid.style.marginTop = '0px';

    const needW = labelW + cols * cellW + cols * gap;
    const needH = labelH + rows * cellH + rows * gap;
    inner.dataset.band = zoomBandOf(cellW, cellH);
    setZoomTip(needW > availW + 1 || needH > availH + 1);
  }

  function renderZoomCtl() {
    els.zoomCtl.dataset.mode = ui.zoomMode;
    els.zoomCtl.querySelectorAll('.zoom-btn').forEach(function (btn) {
      const on = btn.dataset.zoom === ui.zoomMode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    els.zoomRange.value = String(ui.fixedW);
    els.zoomPct.textContent = ui.fixedW + 'px';
  }

  function saveZoomPref() {
    try {
      localStorage.setItem(ZOOM_KEY, JSON.stringify({ mode: ui.zoomMode, w: ui.fixedW }));
    } catch (err) { /* 忽略写入失败 */ }
  }

  function loadZoomPref() {
    try {
      const raw = localStorage.getItem(ZOOM_KEY);
      if (!raw) return;
      const pref = JSON.parse(raw) || {};
      const w = Number(pref.w);
      if (Number.isFinite(w)) ui.fixedW = Math.min(FIXED_MAX_W, Math.max(FIXED_MIN_W, Math.round(w)));
      if (pref.mode === 'fixed') {
        ui.zoomMode = 'fixed';
        return;
      }
      /* 旧的 fit / 100% / custom 记录统一迁移为默认的按比例适配 */
      ui.zoomMode = 'fill';
      if (pref.mode !== 'fill') saveZoomPref();
    } catch (err) { /* 忽略损坏的本地设置 */ }
  }

  function setZoomMode(mode) {
    if (mode !== 'fill' && mode !== 'fixed') return;
    ui.zoomMode = mode;
    saveZoomPref();
    renderZoomCtl();
    applyZoom();
  }

  function scheduleApplyZoom() {
    if (zoomRaf) return;
    zoomRaf = requestAnimationFrame(function () {
      zoomRaf = 0;
      applyZoom();
    });
  }

  /* 窗口/侧边栏尺寸变化结束后再收敛一次，避免在过渡中间值上定尺寸 */
  let zoomSettleTimer = 0;
  function settleApplyZoom() {
    clearTimeout(zoomSettleTimer);
    zoomSettleTimer = setTimeout(applyZoom, 340);
  }

  function hideSearchResults() {
    els.searchResults.classList.remove('show');
    els.searchResults.innerHTML = '';
  }

  function renderSearchResults(hits) {
    if (!hits.length) {
      hideSearchResults();
      return;
    }
    els.searchResults.innerHTML = hits.slice(0, 40).map((h) =>
      '<button type="button" class="search-result" data-zone="' + esc(h.zoneId) + '" data-id="' + esc(h.id) + '">' +
        '<span class="sr-zone">' + esc(h.zoneName) + '</span>' +
        '<span class="sr-id">' + esc(h.id) + '</span>' +
        '<span class="sr-name">' + esc(h.cell.name) + '</span>' +
        '<span class="sr-qty">' + fmtNum(h.cell.qty) + ' ' + esc(h.cell.unit) + '</span>' +
      '</button>').join('');
    els.searchResults.classList.add('show');
  }

  function refreshSearch() {
    const q = els.search.value.trim();
    ui.query = q;
    els.clearSearch.classList.toggle('show', !!q);
    const cross = els.crossSearch.checked;
    els.crossToggleWrap.classList.toggle('on', cross);
    const nodes = els.grid.querySelectorAll('.cell');

    if (!q) {
      nodes.forEach((node) => node.classList.remove('hit', 'dim'));
      els.searchHint.textContent = '';
      els.searchHint.classList.remove('warn');
      hideSearchResults();
      syncAxisHighlight();
      return;
    }

    const hits = Store.search(q);
    const hitIds = new Set(hits.map((h) => h.id));
    nodes.forEach((node) => {
      const isHit = hitIds.has(node.dataset.id);
      node.classList.toggle('hit', isHit);
      node.classList.toggle('dim', cross ? false : !isHit);
    });

    if (cross) {
      const all = Store.searchAll(q);
      renderSearchResults(all);
      els.searchHint.classList.toggle('warn', !all.length);
      if (all.length) {
        els.searchHint.innerHTML = '跨 <b>' + Store.state.zones.length + '</b> 个区域找到 <b>' +
          all.length + '</b> 个匹配 · 点击结果跳转';
      } else {
        els.searchHint.textContent = '所有区域都没有匹配的物料，试试其他名称、型号或类别';
      }
      syncAxisHighlight();
      return;
    }

    hideSearchResults();
    if (hits.length) {
      els.searchHint.innerHTML = '找到 <b>' + hits.length + '</b> 个匹配格位，首个为 <b>' +
        esc(hits[0].id) + '</b>' + cellPosText(hits[0].id) + ' ' + esc(hits[0].cell.name) +
        ' · 按回车定位';
      els.searchHint.classList.remove('warn');
    } else {
      els.searchHint.textContent = '没有找到匹配的物料，试试其他名称、型号或类别';
      els.searchHint.classList.add('warn');
    }
    syncAxisHighlight();
  }

  function renderZones() {
    els.zonesList.innerHTML = Store.state.zones.map((zone, i) => {
      const total = totalOf(zone.rowCounts);
      const used = Object.keys(zone.cells).length;
      const active = zone.id === Store.state.activeZoneId;
      return '<div class="zone-item' + (active ? ' active' : '') + '" data-zone="' + esc(zone.id) +
        '" role="option" tabindex="0" aria-selected="' + (active ? 'true' : 'false') +
        '" title="' + esc(zone.name) + '">' +
        '<span class="zone-mark">' + esc(zone.name.slice(0, 1) || '柜') + '</span>' +
        '<span class="zone-body">' +
          '<span class="zone-name">' + esc(zone.name) + '</span>' +
          '<span class="zone-meta">' + total + ' 格 · 已用 ' + used + '</span>' +
        '</span>' +
        '<span class="zone-tools">' +
          '<button type="button" class="zone-act" data-act="up" aria-label="上移" ' + (i ? '' : 'disabled') + '>↑</button>' +
          '<button type="button" class="zone-act" data-act="down" aria-label="下移" ' + (i < Store.state.zones.length - 1 ? '' : 'disabled') + '>↓</button>' +
          '<button type="button" class="zone-act" data-act="edit" aria-label="编辑区域">✎</button>' +
        '</span>' +
      '</div>';
    }).join('');
  }

  function refresh() {
    const zone = Store.zone;
    const counts = zone.rowCounts;
    const total = totalOf(counts);
    const maxCols = Math.max(1, maxColsOf(counts));
    els.zoneTitle.textContent = zone.name;
    document.title = zone.name + ' · 物料柜管理';
    els.brandMeta.textContent =
      (isUniform(counts)
        ? counts.length + ' × ' + maxCols
        : counts.length + ' 排不等宽 · 最宽 ' + maxCols + ' 格') +
      ' · 共 ' + total + ' 格' + (zone.location ? ' · ' + zone.location : '');
    renderStats();
    renderGrid();
    els.zoneEmpty.hidden = Object.keys(zone.cells).length > 0;
    renderZones();
    refreshSearch();
    applyZoom();
  }

  function updateBodyLock() {
    const locked = els.drawer.classList.contains('open') ||
      els.settingsMask.classList.contains('show');
    document.body.classList.toggle('locked', locked);
  }

  function toast(message, kind) {
    const node = document.createElement('div');
    node.className = 'toast' + (kind ? ' ' + kind : '');
    node.textContent = message;
    els.toasts.appendChild(node);
    setTimeout(() => {
      node.style.transition = 'opacity .25s, transform .25s';
      node.style.opacity = '0';
      node.style.transform = 'translateY(6px)';
      setTimeout(() => node.remove(), 260);
    }, 2600);
  }

  /* ---------------- 7. 抽屉（格位详情） ---------------- */
  function updateDrawerStatus(cell) {
    const status = cellStatus(cell);
    els.drawerStatus.textContent = STATUS_TEXT[status];
    els.drawerStatus.className = 'badge badge-' + status;
  }

  function fillForm(id) {
    const cell = Store.getCell(id);
    els.fName.value = cell ? cell.name : '';
    els.fCategory.value = cell ? cell.category : '电阻';
    els.fModel.value = cell ? cell.model : '';
    els.fQty.value = cell ? cell.qty : '';
    els.fUnit.value = cell ? cell.unit : 'pcs';
    els.fMin.value = cell ? cell.minQty : 0;
    els.fNote.value = cell ? cell.note : '';
    els.fTime.textContent = cell ? fmtTime(cell.updatedAt) : '尚未入库';
    updateDrawerStatus(cell);
  }

  function openDrawer(id) {
    if (!Store.inRange(id)) return;
    ui.currentId = id;
    els.drawerTitle.textContent = Store.zone.name + ' · ' + id + cellPosText(id);
    fillForm(id);
    els.drawer.classList.add('open');
    els.drawer.setAttribute('aria-hidden', 'false');
    els.scrim.classList.add('show');
    updateBodyLock();
    if (window.matchMedia('(min-width: 721px)').matches) {
      setTimeout(() => { try { els.fName.focus(); } catch (err) {} }, 280);
    }
    syncAxisHighlight();
  }

  function closeDrawer() {
    ui.currentId = null;
    els.drawer.classList.remove('open');
    els.drawer.setAttribute('aria-hidden', 'true');
    els.scrim.classList.remove('show');
    updateBodyLock();
    syncAxisHighlight();
  }

  /* ---------------- 8. 交互动作 ---------------- */
  function saveForm() {
    const id = ui.currentId;
    if (!id) return;
    const name = els.fName.value.trim();
    if (!name) {
      toast('请先填写物料名称', 'warn');
      els.fName.focus();
      return;
    }
    const cell = {
      name: name.slice(0, 40),
      category: els.fCategory.value,
      model: els.fModel.value.trim().slice(0, 40),
      qty: parseQty(els.fQty.value, 0),
      unit: els.fUnit.value.trim().slice(0, 6) || 'pcs',
      minQty: parseQty(els.fMin.value, 0),
      note: els.fNote.value.trim().slice(0, 120),
      updatedAt: new Date().toISOString()
    };
    Store.setCell(id, cell);
    notifyChanged(id, cell);
    refresh();
    els.fTime.textContent = fmtTime(cell.updatedAt);
    els.fQty.value = cell.qty;
    updateDrawerStatus(cell);
    toast(id + ' 已保存 · ' + cell.name, 'ok');
  }

  function clearCurrentCell() {
    const id = ui.currentId;
    if (!id) return;
    if (!Store.getCell(id)) {
      toast('该格已经是空位了', 'warn');
      return;
    }
    if (!window.confirm('确认清空 ' + id + ' 格的物料？此操作不可撤销。')) return;
    Store.clearCell(id);
    notifyChanged(id, null);
    refresh();
    closeDrawer();
    toast(id + ' 已清空', 'ok');
  }

  function stepQty(delta) {
    const id = ui.currentId;
    if (!id) return;
    const cell = Store.getCell(id);
    if (!cell) {
      toast('该格暂无物料，请填写信息并保存后再出入库', 'warn');
      return;
    }
    cell.qty = Math.max(0, round2((Number(cell.qty) || 0) + delta));
    cell.updatedAt = new Date().toISOString();
    Store.setCell(id, cell);
    notifyChanged(id, cell);
    els.fQty.value = cell.qty;
    els.fTime.textContent = fmtTime(cell.updatedAt);
    updateDrawerStatus(cell);
    refresh();
    toast((delta > 0 ? '入库 +' : '出库 -') + Math.abs(delta) + ' ' + cell.unit +
      ' · ' + id + ' 剩余 ' + fmtNum(cell.qty), delta > 0 ? 'ok' : '');
  }

  function locateCell(id) {
    const target = els.grid.querySelector('.cell[data-id="' + id + '"]');
    if (!target) {
      toast('格位 ' + id + ' 不在当前布局中', 'warn');
      return;
    }
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.classList.remove('locate');
    void target.offsetWidth;
    target.classList.add('locate');
    syncAxisHighlight();
    setTimeout(() => {
      target.classList.remove('locate');
      syncAxisHighlight();
    }, 2000);
  }

  function jumpToZoneCell(zoneId, id) {
    if (Store.state.activeZoneId !== zoneId) {
      Store.setActiveZone(zoneId);
      closeDrawer();
      refresh();
    }
    if (isMobileZones()) closeZonesDrawer();
    locateCell(id);
    toast('已定位：' + Store.zone.name + ' · ' + id + cellPosText(id), 'ok');
  }

  function locateFirst() {
    if (els.crossSearch.checked) {
      const all = Store.searchAll(els.search.value);
      if (!all.length) {
        toast('所有区域都没有匹配的格位', 'warn');
        return;
      }
      jumpToZoneCell(all[0].zoneId, all[0].id);
      return;
    }
    const hits = Store.search(els.search.value);
    if (!hits.length) {
      toast('没有匹配的格位', 'warn');
      return;
    }
    locateCell(hits[0].id);
    toast('已定位：' + Store.zone.name + ' · ' + hits[0].id + cellPosText(hits[0].id), 'ok');
  }

  /* ---- 区域侧边栏 ---- */
  const isMobileZones = () => window.matchMedia('(max-width: 860px)').matches;

  function setZonesCollapsed(collapsed) {
    ui.zonesCollapsed = collapsed;
    els.zonesPanel.classList.toggle('collapsed', collapsed);
    document.body.classList.toggle('zones-collapsed', collapsed);
    els.btnToggleZones.textContent = collapsed ? '»' : '«';
    els.btnToggleZones.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    els.btnToggleZones.setAttribute('aria-label', collapsed ? '展开区域侧边栏' : '折叠区域侧边栏');
    settleApplyZoom();
  }

  function openZonesDrawer() {
    els.zonesPanel.classList.remove('collapsed');
    document.body.classList.remove('zones-collapsed');
    els.zonesPanel.classList.add('mobile-open');
    els.zonesScrim.classList.add('show');
    els.btnToggleZones.textContent = '«';
    ui.zonesDrawerOpen = true;
    ui.zonesCollapsed = false;
  }

  function closeZonesDrawer() {
    els.zonesPanel.classList.remove('mobile-open');
    els.zonesScrim.classList.remove('show');
    ui.zonesDrawerOpen = false;
    if (isMobileZones()) {
      els.zonesPanel.classList.add('collapsed');
      document.body.classList.add('zones-collapsed');
      els.btnToggleZones.textContent = '»';
    }
  }

  function toggleZones() {
    if (isMobileZones()) {
      if (els.zonesPanel.classList.contains('mobile-open')) closeZonesDrawer();
      else openZonesDrawer();
      return;
    }
    setZonesCollapsed(!ui.zonesCollapsed);
  }

  function switchZone(id) {
    if (!id) return;
    if (id === Store.state.activeZoneId) {
      if (isMobileZones()) closeZonesDrawer();
      return;
    }
    if (!Store.setActiveZone(id)) return;
    closeDrawer();
    refresh();
    if (isMobileZones()) closeZonesDrawer();
    toast('已切换到「' + Store.zone.name + '」', 'ok');
  }

  function notifyChanged(id, cell) {
    const api = window.MaterialCabinet;
    if (api && typeof api.onCellChanged === 'function') {
      try {
        api.onCellChanged(id, cell ? Object.assign({}, cell) : null);
      } catch (err) {
        console.warn('[物料柜] onCellChanged 回调异常', err);
      }
    }
  }

  /* ---------------- 9. 区域编辑器（新增 / 修改 / 复制 / 删除） ---------------- */
  let draft = null;

  function draftZone() {
    if (draft && draft.zoneId) return Store.zoneById(draft.zoneId) || Store.zone;
    return Store.zone;
  }

  function buildMaxOptions() {
    let html = '<option value="auto">自动</option>';
    for (let i = 1; i <= COLS_MAX; i++) html += '<option value="' + i + '">' + i + ' 格</option>';
    els.sMax.innerHTML = html;
  }

  function syncTotal(commit) {
    if (!draft) return;
    const raw = parseInt(els.sTotal.value, 10);
    if (!Number.isFinite(raw)) {
      if (commit) els.sTotal.value = draft.total;
      return;
    }
    const total = Math.min(TOTAL_MAX, Math.max(1, raw));
    if (commit) els.sTotal.value = total;
    draft.total = total;
    let counts;
    if (els.sMax.value === 'auto') {
      counts = autoRowCounts(total);
    } else {
      const max = Math.min(COLS_MAX, Math.max(1, parseInt(els.sMax.value, 10) || 4));
      counts = distribute(total, Math.ceil(total / max));
    }
    draft.rowCounts = counts;
    els.totalHint.textContent = counts.length + ' 排 · 每排 ' + counts.join(' / ') + ' 格 · 共 ' + total + ' 格';
    renderPreview();
  }

  function switchLayoutMode(mode) {
    if (!draft) return;
    draft.layoutMode = mode === 'custom' ? 'custom' : 'total';
    els.segBtns.forEach((btn) => {
      const on = btn.dataset.mode === draft.layoutMode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    els.panelTotal.hidden = draft.layoutMode !== 'total';
    els.panelCustom.hidden = draft.layoutMode !== 'custom';
    if (draft.layoutMode === 'total') {
      els.sTotal.value = draft.total;
      syncTotal(false);
      return;
    }
    if (!draft.rowCounts.length) draft.rowCounts = [4, 4, 4, 4, 4, 4];
    els.sTotal.value = totalOf(draft.rowCounts);
    renderRowEditor();
    renderPreview();
  }

  function renderRowEditor() {
    const counts = draft ? draft.rowCounts : [];
    els.rowEditor.innerHTML = counts.map((n, i) => {
      const last = i === counts.length - 1;
      return '<div class="row-editor-item">' +
        '<span class="row-letter">' + rowLetter(i) + '</span>' +
        '<span class="row-title">第 ' + (i + 1) + ' 排</span>' +
        '<input class="row-count" type="number" min="1" max="' + COLS_MAX + '" step="1" value="' + n +
          '" data-row="' + i + '" aria-label="第 ' + (i + 1) + ' 排格数">' +
        '<span class="row-unit">格</span>' +
        (last && counts.length > 1
          ? '<button type="button" class="row-del" data-del="' + i + '" aria-label="删除第 ' + (i + 1) + ' 排">×</button>'
          : '<span class="row-del-space"></span>') +
      '</div>';
    }).join('');
    els.btnAddRow.disabled = counts.length >= ROWS_MAX;
  }

  function addRow() {
    if (!draft) return;
    if (draft.rowCounts.length >= ROWS_MAX) {
      toast('最多支持 ' + ROWS_MAX + ' 排', 'warn');
      return;
    }
    const last = draft.rowCounts[draft.rowCounts.length - 1] || 4;
    draft.rowCounts.push(last);
    els.sTotal.value = totalOf(draft.rowCounts);
    renderRowEditor();
    renderPreview();
  }

  function onRowInput(event) {
    if (!draft) return;
    const input = event.target.closest('.row-count');
    if (!input) return;
    const i = parseInt(input.dataset.row, 10);
    const v = parseInt(input.value, 10);
    if (!Number.isInteger(v) || v < 1 || v > COLS_MAX) return;
    draft.rowCounts[i] = v;
    els.sTotal.value = totalOf(draft.rowCounts);
    renderPreview();
  }

  function onRowChange(event) {
    if (!draft) return;
    const input = event.target.closest('.row-count');
    if (!input) return;
    const i = parseInt(input.dataset.row, 10);
    const v = clampInt(input.value, 1, COLS_MAX, draft.rowCounts[i]);
    draft.rowCounts[i] = v;
    input.value = v;
    els.sTotal.value = totalOf(draft.rowCounts);
    renderPreview();
  }

  function onRowEditorClick(event) {
    if (!draft) return;
    const btn = event.target.closest('[data-del]');
    if (!btn || draft.rowCounts.length <= 1) return;
    draft.rowCounts.pop();
    els.sTotal.value = totalOf(draft.rowCounts);
    renderRowEditor();
    renderPreview();
  }

  function renderPreview() {
    if (!draft) return;
    const counts = draft.rowCounts;
    const maxCols = Math.max(1, maxColsOf(counts));
    els.previewGrid.style.setProperty('--cols', maxCols);
    els.previewGrid.classList.toggle('dense', maxCols >= 9);

    const existing = draft.kind === 'edit' ? draftZone() : null;
    const prevValid = existing ? new Set(Store.zoneLabels(existing)) : new Set();
    const cells = existing ? existing.cells : {};
    const hidden = existing ? existing.hidden : {};
    let html = '';
    counts.forEach((n, r) => {
      for (let c = 0; c < maxCols; c++) {
        if (c >= n) {
          html += '<span class="preview-gap"></span>';
          continue;
        }
        const id = labelAt(r, c);
        const cell = cells[id];
        const restored = !cell && hidden[id];
        html += '<span class="preview-cell state-' + cellStatus(cell) + (restored ? ' restore' : '') + '">' +
          id + '</span>';
      }
    });
    els.previewGrid.innerHTML = html;
    els.previewMeta.textContent = counts.length + ' 排 · 最宽 ' + maxCols + ' 格 · 共 ' + totalOf(counts) + ' 格';

    const nextValid = new Set();
    counts.forEach((n, r) => {
      for (let c = 0; c < n; c++) nextValid.add(labelAt(r, c));
    });
    let added = 0;
    nextValid.forEach((id) => { if (!prevValid.has(id)) added++; });
    let kept = 0;
    let stashed = 0;
    Object.keys(cells).forEach((id) => {
      if (nextValid.has(id)) kept++;
      else stashed++;
    });
    let restored = 0;
    Object.keys(hidden).forEach((id) => { if (nextValid.has(id)) restored++; });
    let note = '保留 <b>' + kept + '</b> · 新增空位 <b>' + added + '</b>';
    if (restored) note += ' · 恢复暂存 <b>' + restored + '</b>';
    if (stashed) note += ' · <span class="warn">暂存移除 ' + stashed + '</span>';
    els.previewNote.innerHTML = note;
  }

  function openZoneEditor(kind, zoneId) {
    closeDrawer();
    if (isMobileZones()) closeZonesDrawer();
    const editing = kind === 'edit';
    const zone = editing ? Store.zoneById(zoneId) : null;
    if (editing && !zone) return;
    const counts = zone ? zone.rowCounts.slice() : [4, 4, 4, 4, 4, 4];
    draft = {
      kind: editing ? 'edit' : 'create',
      zoneId: zone ? zone.id : null,
      layoutMode: zone && (zone.layoutMode === 'custom' || !isUniform(counts)) ? 'custom' : 'total',
      total: totalOf(counts),
      rowCounts: counts,
      name: zone ? zone.name : '',
      note: zone ? zone.note : '',
      location: zone ? zone.location : ''
    };
    els.settingsTitle.textContent = editing ? '区域设置' : '新增区域';
    els.btnApplySettings.textContent = editing ? '应用布局' : '创建区域';
    els.zoneDanger.hidden = !editing;
    els.sName.value = draft.name;
    els.sNote.value = draft.note;
    els.sLocation.value = draft.location;
    buildMaxOptions();
    els.sTotal.value = draft.total;
    els.sMax.value = draft.layoutMode === 'total' ? String(Math.max(1, maxColsOf(counts))) : 'auto';
    switchLayoutMode(draft.layoutMode);
    els.settingsMask.classList.add('show');
    ui.settingsOpen = true;
    updateBodyLock();
  }

  function closeSettings() {
    els.settingsMask.classList.remove('show');
    ui.settingsOpen = false;
    draft = null;
    updateBodyLock();
  }

  function applyZoneSettings() {
    if (!draft) return;
    if (draft.layoutMode === 'total') syncTotal(true);
    if (!draft.rowCounts.length) draft.rowCounts = [4];
    const name = els.sName.value.trim().slice(0, 30) ||
      (draft.kind === 'create' ? '区域 ' + (Store.state.zones.length + 1) : Store.zone.name);
    const note = els.sNote.value.trim().slice(0, 80);
    const location = els.sLocation.value.trim().slice(0, 60);
    const kind = draft.kind;
    const zoneId = draft.zoneId;
    const rowCounts = draft.rowCounts.slice();
    const layoutMode = draft.layoutMode;
    closeSettings();

    if (kind === 'create') {
      const zone = Store.addZone({ name, note, location, rowCounts, layoutMode });
      refresh();
      toast('已创建区域「' + zone.name + '」 · ' + rowCounts.length + ' 排 / ' + totalOf(rowCounts) + ' 格', 'ok');
      return;
    }

    const result = Store.updateZone(zoneId, { name, note, location, rowCounts, layoutMode });
    if (!result) return;
    Store.setActiveZone(zoneId);
    refresh();
    if (ui.currentId && !Store.inRange(ui.currentId)) closeDrawer();
    const parts = [];
    if (result.stashed) parts.push(result.stashed + ' 个移除格位已暂存');
    if (result.restored) parts.push(result.restored + ' 个暂存格位已恢复');
    if (result.added) parts.push('新增 ' + result.added + ' 个空位');
    toast('区域「' + Store.zone.name + '」已更新：' + rowCounts.length + ' 排 · ' + result.total + ' 格' +
      (parts.length ? '，' + parts.join('，') : ''), result.stashed ? 'warn' : 'ok');
  }

  function copyZoneFromEditor() {
    if (!draft || draft.kind !== 'edit') return;
    const copy = Store.copyZone(draft.zoneId);
    if (!copy) return;
    closeSettings();
    refresh();
    toast('已复制为「' + copy.name + '」（布局与数据已同步）', 'ok');
  }

  function deleteZonePrompt() {
    if (!draft || draft.kind !== 'edit') return;
    const zone = Store.zoneById(draft.zoneId);
    if (!zone) return;
    if (Store.state.zones.length <= 1) {
      toast('至少保留一个区域，无法删除', 'warn');
      return;
    }
    const used = Object.keys(zone.cells).length;
    if (!window.confirm('删除区域「' + zone.name + '」？\n\n该区域 ' + used +
      ' 个格位的物料数据将不可恢复，导出的旧备份也无法找回。')) return;
    Store.removeZone(zone.id);
    closeSettings();
    refresh();
    toast('已删除区域「' + zone.name + '」', 'warn');
  }

  /* ---------------- 10. 备份：导出 / 导入 ---------------- */
  function downloadBackup() {
    const data = Store.backup();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const link = document.createElement('a');
    link.href = url;
    link.download = '物料柜-全部区域-备份-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
    const count = data.zones.reduce((n, z) => n + Object.keys(z.cells).length, 0);
    toast('已导出 ' + data.zones.length + ' 个区域 / ' + count + ' 个格位', 'ok');
  }

  function triggerImport() {
    els.fileInput.value = '';
    els.fileInput.click();
  }

  function handleImportFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      toast('文件过大（上限 5MB）', 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = function () {
      let data = null;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        toast('JSON 解析失败，请检查备份文件格式', 'err');
        return;
      }
      try {
        validateBackup(data);
      } catch (err) {
        toast('导入失败：' + err.message, 'err');
        return;
      }
      const zoneCount = Array.isArray(data.zones) ? data.zones.length : 1;
      const count = Array.isArray(data.zones)
        ? data.zones.reduce((n, z) => n + Object.keys((z && z.cells) || {}).length, 0)
        : Object.keys(data.cells || {}).length;
      if (!window.confirm('即将用备份覆盖当前全部区域（' + zoneCount + ' 个区域 / ' + count +
        ' 个格位），是否继续？')) return;
      Store.replaceState(data);
      closeDrawer();
      closeSettings();
      refresh();
      toast('导入成功：' + Store.state.zones.length + ' 个区域 / ' + count + ' 个格位', 'ok');
    };
    reader.onerror = function () { toast('文件读取失败', 'err'); };
    reader.readAsText(file, 'utf-8');
  }

  /* ---------------- 11. 事件绑定 ---------------- */
  function bindEvents() {
    els.grid.addEventListener('click', function (event) {
      const node = event.target.closest('.cell');
      if (node) openDrawer(node.dataset.id);
    });

    /* 缩放档位：按比例适配（默认）/ 固定尺寸（选择持久化，切区域后保持） */
    els.zoomCtl.addEventListener('click', function (event) {
      const btn = event.target.closest('.zoom-btn');
      if (!btn) return;
      setZoomMode(btn.dataset.zoom);
    });
    els.zoomRange.addEventListener('input', function () {
      const w = Math.min(FIXED_MAX_W, Math.max(FIXED_MIN_W, parseInt(els.zoomRange.value, 10) || 120));
      ui.fixedW = w;
      ui.zoomMode = 'fixed';
      els.zoomCtl.dataset.mode = 'fixed';
      els.zoomPct.textContent = w + 'px';
      els.zoomCtl.querySelectorAll('.zoom-btn').forEach(function (btn) {
        const on = btn.dataset.zoom === 'fixed';
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      saveZoomPref();
      scheduleApplyZoom();
    });

    els.search.addEventListener('input', refreshSearch);
    els.search.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        locateFirst();
      } else if (event.key === 'Escape') {
        els.search.value = '';
        refreshSearch();
        els.search.blur();
      }
    });
    els.clearSearch.addEventListener('click', function () {
      els.search.value = '';
      refreshSearch();
      els.search.focus();
    });

    els.btnSettings.addEventListener('click', function () {
      openZoneEditor('edit', Store.state.activeZoneId);
    });
    els.btnExport.addEventListener('click', downloadBackup);
    els.btnImport.addEventListener('click', triggerImport);
    els.fileInput.addEventListener('change', handleImportFile);

    /* 区域侧边栏 */
    els.btnToggleZones.addEventListener('click', toggleZones);
    els.btnAddZone.addEventListener('click', function () { openZoneEditor('create'); });
    els.btnZoneEmptyCta.addEventListener('click', function () { openDrawer('A1'); });
    els.zonesScrim.addEventListener('click', closeZonesDrawer);
    els.zonesList.addEventListener('click', function (event) {
      const act = event.target.closest('[data-act]');
      if (act) {
        const item = act.closest('.zone-item');
        if (!item) return;
        const zoneId = item.dataset.zone;
        const kind = act.dataset.act;
        if (kind === 'edit') {
          openZoneEditor('edit', zoneId);
          return;
        }
        if (Store.moveZone(zoneId, kind === 'up' ? -1 : 1)) {
          refresh();
          toast('区域顺序已更新', 'ok');
        }
        return;
      }
      const item = event.target.closest('.zone-item');
      if (item) switchZone(item.dataset.zone);
    });
    els.zonesList.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      if (event.target.closest('[data-act]')) return;
      const item = event.target.closest('.zone-item');
      if (!item) return;
      event.preventDefault();
      switchZone(item.dataset.zone);
    });

    /* 跨区域搜索 */
    els.crossSearch.addEventListener('change', refreshSearch);
    els.searchResults.addEventListener('click', function (event) {
      const btn = event.target.closest('.search-result');
      if (!btn) return;
      jumpToZoneCell(btn.dataset.zone, btn.dataset.id);
    });

    els.btnCloseDrawer.addEventListener('click', closeDrawer);
    els.scrim.addEventListener('click', closeDrawer);

    els.cellForm.addEventListener('submit', function (event) {
      event.preventDefault();
      saveForm();
    });
    els.btnSave.addEventListener('click', saveForm);
    els.btnClear.addEventListener('click', clearCurrentCell);
    els.btnMinus.addEventListener('click', function () { stepQty(-1); });
    els.btnPlus.addEventListener('click', function () { stepQty(1); });

    /* 数量输入框回车不提交整柜，直接保存 */
    els.fQty.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveForm();
      }
    });

    els.btnCloseSettings.addEventListener('click', closeSettings);
    els.btnCancelSettings.addEventListener('click', closeSettings);
    els.btnApplySettings.addEventListener('click', applyZoneSettings);
    els.settingsForm.addEventListener('submit', function (event) {
      event.preventDefault();
      applyZoneSettings();
    });
    els.settingsMask.addEventListener('click', function (event) {
      if (event.target === els.settingsMask) closeSettings();
    });
    els.segBtns.forEach(function (btn) {
      btn.addEventListener('click', function () { switchLayoutMode(btn.dataset.mode); });
    });
    els.sTotal.addEventListener('input', function () { syncTotal(false); });
    els.sTotal.addEventListener('change', function () { syncTotal(true); });
    els.sMax.addEventListener('change', function () { syncTotal(false); });
    els.btnAddRow.addEventListener('click', addRow);
    els.rowEditor.addEventListener('click', onRowEditorClick);
    els.rowEditor.addEventListener('input', onRowInput);
    els.rowEditor.addEventListener('change', onRowChange);
    els.btnCopyZone.addEventListener('click', copyZoneFromEditor);
    els.btnDeleteZone.addEventListener('click', deleteZonePrompt);

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      if (ui.settingsOpen) {
        closeSettings();
        return;
      }
      if (els.drawer.classList.contains('open')) {
        closeDrawer();
        return;
      }
      if (els.zonesPanel.classList.contains('mobile-open')) closeZonesDrawer();
    });
  }

  /* ---------------- 12. 初始化 ---------------- */
  function checkStorage() {
    try {
      const k = '__cabinet_probe__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (err) {
      return false;
    }
  }

  (function init() {
    const seeded = Store.load();
    els.fCategory.innerHTML = CATEGORIES.map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
    }).join('');
    loadZoomPref();
    renderZoomCtl();
    setZonesCollapsed(isMobileZones());
    refresh();
    bindEvents();

    let wasMobile = isMobileZones();
    window.addEventListener('resize', function () {
      const mobile = isMobileZones();
      if (mobile === wasMobile) return;
      wasMobile = mobile;
      closeZonesDrawer();
      setZonesCollapsed(mobile);
    });

    /* 尺寸变化只重算格子大小，不重建 DOM */
    window.addEventListener('resize', function () {
      scheduleApplyZoom();
      settleApplyZoom();
    });
    if ('ResizeObserver' in window) {
      let lastInnerW = -1;
      new ResizeObserver(function (entries) {
        const w = Math.round(entries[0].contentRect.width);
        if (Math.abs(w - lastInnerW) < 1) return;
        lastInnerW = w;
        scheduleApplyZoom();
      }).observe(els.cabinetInner);
    }

    // 对外暴露的扩展接口：硬件锁 / 扫码枪 / 外部数据源可复用同一套数据模型
    window.MaterialCabinet = {
      version: VERSION,
      store: Store,
      refresh: refresh,
      openCell: openDrawer,
      closePanel: closeDrawer,
      search: function (q) { return Store.search(q); },
      searchAll: function (q) { return Store.searchAll(q); },
      zones: function () {
        return Store.state.zones.map(function (z) {
          return { id: z.id, name: z.name, rowCounts: z.rowCounts.slice(), used: Object.keys(z.cells).length };
        });
      },
      onCellChanged: null
    };

    if (seeded) {
      toast('已载入示例物料，点击柜格即可编辑', 'ok');
    }
    if (!checkStorage()) {
      toast('当前环境无法写入 localStorage，修改仅在本次会话有效', 'warn');
    }
  })();
})();
</script>
</body>
</html>
