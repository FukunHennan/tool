<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCB 物料柜 · 可视化管理</title>
<style>
  /* ============================================================
     0. 基础变量与重置
     ============================================================ */
  :root{
    --bg: #0b0f14;
    --panel: #141b23;
    --panel-2: #1a222c;
    --line: rgba(255,255,255,.10);
    --line-soft: rgba(255,255,255,.06);
    --text: #e8f1f9;
    --muted: #8b98a7;
    --muted-2: #64717f;
    --cyan: #38bdf8;
    --green: #2dd4a0;
    --amber: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
    --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding-left: 220px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: padding-left .18s ease;
  }
  body.zones-collapsed{ padding-left: 64px; }
  body.locked{ overflow: hidden; }
  button{ font-family: inherit; }
  input, select, textarea{ font-family: inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#2c3745; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============================================================
     1. 顶栏
     ============================================================ */
  /* 单行顶栏：60px，sticky；左侧区域名 + 指标，右侧搜索 / 缩放 / 导入导出 / 设置 */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 30;
    flex: 0 0 auto;
    height: 60px;
    padding: 0 16px;
    background: rgba(11,15,20,.94);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner{
    height: 100%; max-width: none; margin: 0;
    display: flex; align-items: center; gap: 14px;
  }

  .brand{ display: flex; align-items: center; gap: 9px; min-width: 0; flex: 0 1 auto; }
  .logo{
    width: 28px; height: 28px; flex: none;
    border-radius: 6px;
    display: grid; place-items: center;
    background: rgba(56,189,248,.10);
    border: 1px solid rgba(56,189,248,.22);
    color: #7dd3fc;
  }
  .logo svg{ width: 16px; height: 16px; }
  .brand-text{ min-width: 0; }
  .brand-name{
    font-size: 14px; font-weight: 600; letter-spacing: .02em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-meta{
    margin-top: 1px;
    font-size: 10.5px;
    color: var(--muted-2);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 指标：纯数字，无卡片背景 */
  .stats{ display: flex; align-items: center; flex: 0 0 auto; }
  .stat{
    display: flex; align-items: baseline; gap: 5px;
    padding: 0 12px;
    border-left: 1px solid var(--line-soft);
  }
  .stat:first-child{ border-left: 0; padding-left: 2px; }
  .stat-label{ font-size: 10.5px; color: var(--muted-2); letter-spacing: .02em; }
  .stat b{ font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat b small{ font-size: 10px; font-weight: 400; color: var(--muted-2); }
  .stat.warn b{ color: #fbbf24; }

  .tool-row{
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; min-width: 0;
    flex: 0 1 auto;
  }
  .search-wrap{ position: relative; flex: 1 1 180px; min-width: 96px; max-width: 320px; }
  .searchbox{
    display: flex; align-items: center; gap: 6px;
    height: 32px;
    padding: 0 8px;
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    transition: border-color .16s;
  }
  .searchbox:focus-within{ border-color: rgba(56,189,248,.55); }
  .searchbox > svg{ width: 14px; height: 14px; color: var(--muted); flex: none; }
  .searchbox input{
    flex: 1; min-width: 0;
    height: 100%;
    background: none; border: 0; outline: 0;
    color: var(--text);
    font-size: 12.5px;
  }
  .searchbox input::placeholder{ color: #6d7a89; }
  .searchbox input::-webkit-search-cancel-button{ display: none; }
  .search-clear{
    display: none;
    width: 20px; height: 20px; flex: none;
    border-radius: 4px;
    border: 0;
    background: rgba(255,255,255,.08);
    color: var(--muted);
    font-size: 12px; line-height: 1;
    cursor: pointer;
  }
  .search-clear.show{ display: grid; place-items: center; }
  .search-clear:hover{ color: var(--text); background: rgba(255,255,255,.16); }

  /* 搜索下拉：绝对定位，不撑高顶栏 */
  .search-drop{
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    z-index: 40;
    width: min(460px, calc(100vw - 40px));
    display: flex; flex-direction: column; gap: 4px;
  }
  .search-results{
    display: none;
    max-height: 260px; overflow-y: auto;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(13,19,26,.98);
    box-shadow: 0 18px 40px -20px rgba(0,0,0,.9);
  }
  .search-results.show{ display: block; }
  .search-result{
    width: 100%;
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px;
    border: 0; border-radius: 6px;
    background: none;
    color: var(--text);
    font-size: 12.5px; text-align: left; cursor: pointer;
  }
  .search-result:hover{ background: rgba(56,189,248,.10); }
  .search-result .sr-zone{
    flex: none;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(56,189,248,.12);
    color: #7dd3fc;
    font-size: 10.5px;
  }
  .search-result .sr-id{ flex: none; font-family: var(--mono); font-size: 11px; color: #9fc0d8; }
  .search-result .sr-name{ flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-result .sr-qty{ flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

  .search-hint{
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line-soft);
    background: rgba(13,19,26,.98);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .search-hint:empty{ display: none; }
  .search-hint b{ color: #7dd3fc; font-family: var(--mono); }
  .search-hint.warn{ color: #fbbf24; }

  .actions{ display: flex; gap: 6px; flex: none; }
  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px;
    padding: 0 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.05);
    color: #d7e3ee;
    font-size: 13px;
    cursor: pointer;
    transition: background .16s, border-color .16s, color .16s, transform .16s;
    white-space: nowrap;
  }
  .btn svg{ width: 15px; height: 15px; }
  .btn:hover{ border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.10); color: #eaf6ff; }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{
    background: linear-gradient(180deg,#3ec7fa,#0ea5e9);
    border-color: transparent;
    color: #06121b;
    font-weight: 700;
  }
  .btn.primary:hover{ filter: brightness(1.06); color: #06121b; }
  .btn.danger.ghost{
    color: #fca5a5;
    border-color: rgba(248,113,113,.32);
    background: rgba(248,113,113,.07);
  }
  .btn.danger.ghost:hover{ background: rgba(248,113,113,.16); color: #fecaca; border-color: rgba(248,113,113,.55); }
  /* 顶栏按钮统一压到 32px */
  .tool-row .btn{ height: 32px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .tool-row .btn.icon-only{ width: 32px; padding: 0; }
  .tool-row .btn svg{ width: 14px; height: 14px; }

  /* ============================================================
     2. 柜体
     ============================================================ */
  /* 主舞台：撑满顶栏以下的空间，网格区左上对齐 */
  .stage{
    flex: 1 1 auto; min-height: 0;
    max-width: none; margin: 0;
    padding: 8px 12px 6px;
    display: flex; flex-direction: column;
  }

  /* 极简：无外框、无背景、无阴影 */
  .cabinet{
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    position: relative;
    padding: 0;
    border-radius: 8px;
    background: transparent;
  }

  /* 空区域提示：一行文字 + 引导按钮，仅在整区无物料时出现 */
  .zone-empty{
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .zone-empty[hidden]{ display: none; }
  .zone-empty .btn{ height: 26px; padding: 0 10px; font-size: 11.5px; }

  /* 内容区零内边距，网格紧贴可用区域左上角 */
  .cabinet-inner{
    flex: 1 1 auto;
    min-height: 0;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    overflow: auto;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    gap: 10px;
  }
  .cell-gap{ min-width: 0; border-radius: 12px; }

  /* ---------- 格门 ---------- */
  .cell{
    position: relative;
    display: flex; flex-direction: column;
    min-width: 0;
    min-height: 112px;
    padding: 10px 10px 9px 16px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.075);
    background: #171e26;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: border-color .16s, background .16s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .cell::before{ /* 状态标识条（唯一的状态色块，无发光） */
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 6px 0 0 6px;
    background: #3b4654;
  }
  .cell:hover{
    border-color: rgba(56,189,248,.35);
    background: #1a222b;
  }
  .cell:focus-visible{
    outline: 2px solid rgba(56,189,248,.8);
    outline-offset: 2px;
  }
  .cell-top{ display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .cell-id{
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #9fc0d8;
    padding: 3px 6px;
    line-height: 1;
    flex: none;
  }
  .cell-tag{
    font-size: 9.5px;
    color: #93a1b1;
    padding: 2px 7px;
    line-height: 1.4;
    max-width: 62%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell-main{ flex: 1; min-height: 0; margin-top: 7px; }
  .cell-name{
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13.5px;
    font-weight: 650;
    line-height: 1.34;
    color: #eaf4fc;
    word-break: break-word;
  }
  .cell-model{
    margin-top: 3px;
    font-size: 10.5px;
    color: #8797a8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell-foot{
    display: flex; align-items: flex-end; justify-content: space-between; gap: 6px;
    margin-top: 8px;
  }
  .cell-qty{
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: #f4f9fd;
    letter-spacing: -.01em;
  }
  .cell-qty em{
    font-style: normal;
    font-size: 9.5px;
    font-weight: 500;
    color: #8797a8;
    margin-left: 3px;
  }
  .cell-state-text{
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .06em;
    padding-bottom: 1px;
    flex: none;
  }
  .cell-level{
    height: 3px;
    margin-top: 8px;
    border-radius: 2px;
    background: rgba(255,255,255,.07);
    overflow: hidden;
  }
  .cell-level i{ display: block; height: 100%; border-radius: 2px; background: var(--green); }
  .cell.state-empty{ background: #151b22; border-style: dashed; border-color: rgba(255,255,255,.1); }
  .cell.state-empty::before{ background: #3b4654; }
  .cell.state-empty .cell-tag{ color: #6f7d8c; }
  .cell-empty{
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: #56626f;
    font-size: 11.5px;
    padding: 8px 0 2px;
  }
  .cell-empty svg{ width: 16px; height: 16px; }
  .state-empty .cell-qty{ color: #4d5a68; }
  .state-normal::before{ background: var(--green); }
  .cell.state-low{
    border-color: rgba(245,158,11,.34);
    background: rgba(245,158,11,.06);
  }
  .state-low::before{ background: var(--amber); }
  .state-low .cell-qty{ color: #fcd34d; }
  .state-low .cell-level i{ background: var(--amber); }
  .state-low .cell-state-text{ color: #fbbf24; }
  .cell.state-out{
    border-color: rgba(239,68,68,.4);
    background: rgba(239,68,68,.07);
  }
  .state-out::before{ background: var(--red); }
  .state-out .cell-qty{ color: #fca5a5; }
  .state-out .cell-level i{ background: var(--red); width: 0 !important; }
  .state-out .cell-state-text{ color: #f87171; animation: outblink 1.8s ease-in-out infinite; }
  @keyframes outblink{ 0%,100%{ opacity: 1 } 50%{ opacity: .45 } }

  .cell.hit{
    border-color: rgba(56,189,248,.75);
    box-shadow: 0 0 0 1px rgba(56,189,248,.75);
  }
  .cell.dim{ opacity: .38; filter: saturate(.55); }
  .cell.locate{ animation: locatePulse .95s ease-out 2; }
  @keyframes locatePulse{
    0%{ box-shadow: 0 0 0 0 rgba(56,189,248,.85), 0 0 0 2px rgba(56,189,248,.9); }
    70%{ box-shadow: 0 0 0 12px rgba(56,189,248,0), 0 0 0 2px rgba(56,189,248,.9); }
    100%{ box-shadow: 0 0 0 0 rgba(56,189,248,0), 0 0 0 2px rgba(56,189,248,.9); }
  }

  /* ---------- 图例：单行，色点 + 文字，总高 ≤ 28px ---------- */
  .legend{
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-top: 6px;
    padding: 0 2px;
    height: 20px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-item{ display: inline-flex; align-items: center; gap: 5px; }
  .legend-item .dot{ width: 6px; height: 6px; border-radius: 50%; }
  .dot.empty{ background: #3b4654; }
  .dot.normal{ background: var(--green); }
  .dot.low{ background: var(--amber); }
  .dot.out{ background: var(--red); }

  /* ============================================================
     3. 遮罩 / 抽屉
     ============================================================ */
  .scrim{
    position: fixed; inset: 0;
    z-index: 50;
    background: rgba(3,6,9,.62);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .scrim.show{ opacity: 1; pointer-events: auto; }

  .drawer{
    position: fixed;
    top: 0; right: 0; bottom: 0;
    z-index: 60;
    width: min(430px, 100%);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg,#18202a,#121820);
    border-left: 1px solid var(--line);
    box-shadow: -30px 0 80px -30px rgba(0,0,0,.95);
    transform: translateX(105%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .drawer.open{ transform: translateX(0); }
  .drawer-grip{ display: none; }
  .drawer-head{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .drawer-eyebrow{
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--muted-2);
    text-transform: uppercase;
  }
  .drawer-head h2{
    margin: 4px 0 0;
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: .06em;
    line-height: 1;
  }
  .drawer-head-right{ display: flex; align-items: center; gap: 8px; }
  .badge{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(45,212,160,.12);
    color: #6ee7bf;
    border: 1px solid rgba(45,212,160,.3);
    white-space: nowrap;
  }
  .badge.badge-empty{ background: rgba(255,255,255,.06); color: var(--muted); border-color: var(--line); }
  .badge.badge-low{ background: rgba(245,158,11,.12); color: #fbbf24; border-color: rgba(245,158,11,.35); }
  .badge.badge-out{ background: rgba(239,68,68,.12); color: #f87171; border-color: rgba(239,68,68,.35); }
  .icon-btn{
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    border-radius: 8px;
    border: 1px solid var(--line-soft);
    background: rgba(255,255,255,.05);
    color: var(--muted);
    font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  .icon-btn:hover{ color: var(--text); background: rgba(255,255,255,.12); }
  .drawer-body{
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-foot{
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line-soft);
    background: rgba(9,13,18,.6);
  }
  .drawer-foot .btn.primary{ flex: 1.4; height: 44px; }
  .drawer-foot .btn.danger.ghost{ height: 44px; }

  /* ---------- 表单 ---------- */
  .field{ display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label{
    font-size: 11.5px;
    letter-spacing: .05em;
    color: var(--muted);
  }
  .field input, .field select, .field textarea{
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.045);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .field textarea{ resize: vertical; min-height: 58px; line-height: 1.5; font-size: 13px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: rgba(56,189,248,.55);
    box-shadow: 0 0 0 3px rgba(56,189,248,.1);
    background: rgba(255,255,255,.07);
  }
  .field select{ appearance: none; -webkit-appearance: none; cursor: pointer; }
  .field-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .readonly{
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px dashed rgba(255,255,255,.12);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.35;
  }
  .hint{ font-size: 11px; color: var(--muted-2); margin-top: 2px; }
  .stepper{ display: flex; align-items: center; gap: 8px; }
  .step-btn{
    width: 40px; height: 40px; flex: none;
    border-radius: 9px;
    border: 1px solid rgba(56,189,248,.32);
    background: rgba(56,189,248,.1);
    color: #7dd3fc;
    font-size: 20px; line-height: 1;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .step-btn:hover{ background: rgba(56,189,248,.2); }
  .step-btn:active{ transform: scale(.96); }
  .stepper #f-qty{
    flex: 1; min-width: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 700;
  }
  .stepper .unit-input{
    width: 64px; flex: none;
    text-align: center;
    padding-left: 4px; padding-right: 4px;
  }

  /* ============================================================
     4. 设置弹窗 / Toast
     ============================================================ */
  .modal-mask{
    position: fixed; inset: 0;
    z-index: 70;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    background: rgba(3,6,9,.72);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-mask.show{ opacity: 1; pointer-events: auto; }
  .modal{
    width: min(460px, 100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    border-radius: 8px;
    background: #151c24;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 90px -30px #000;
    transform: translateY(12px) scale(.98);
    transition: transform .22s;
  }
  .modal-mask.show .modal{ transform: none; }
  .modal-head{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 20px 12px;
  }
  .modal-head h2{ margin: 0; font-size: 16px; letter-spacing: .03em; }
  .modal-body{ padding: 6px 20px 4px; }
  .modal-foot{
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 14px 20px 18px;
  }
  .modal-note{
    display: flex; gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(56,189,248,.07);
    border: 1px solid rgba(56,189,248,.16);
    color: #9dc4da;
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .modal-note svg{ width: 15px; height: 15px; flex: none; margin-top: 2px; color: #7dd3fc; }

  /* ---------- 布局编辑器 ---------- */
  .modal.layout-modal{ width: min(680px, 100%); }
  .segmented{
    display: flex; gap: 4px;
    padding: 4px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line-soft);
  }
  .seg-btn{
    flex: 1;
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .seg-btn:hover{ color: var(--text); }
  .seg-btn.active{
    background: rgba(56,189,248,.14);
    color: #bfe9ff;
    box-shadow: inset 0 0 0 1px rgba(56,189,248,.38);
  }
  .mode-panel[hidden]{ display: none; }
  .row-editor{
    max-height: 188px;
    overflow-y: auto;
    padding: 7px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,.16);
  }
  .row-editor-item{
    display: flex; align-items: center; gap: 8px;
    padding: 5px 2px;
    border-bottom: 1px dashed rgba(255,255,255,.06);
  }
  .row-editor-item:last-child{ border-bottom: 0; }
  .row-letter{
    width: 26px; height: 26px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    background: rgba(56,189,248,.12);
    color: #9fd9f5;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .row-title{ flex: 1; font-size: 12px; color: var(--muted); }
  .row-count{
    width: 62px;
    padding: 5px 8px;
    text-align: center;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.045);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
  }
  .row-count:focus{ border-color: rgba(56,189,248,.55); box-shadow: 0 0 0 2px rgba(56,189,248,.1); }
  .row-unit{ font-size: 11px; color: var(--muted-2); }
  .row-del{ width: 26px; height: 26px; font-size: 14px; }
  .row-del-space{ width: 26px; height: 26px; flex: none; }
  .row-editor-foot{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 10px;
  }
  .btn.tiny{ height: 32px; padding: 0 11px; font-size: 12px; }
  .row-editor-foot .hint{ margin: 0; text-align: right; }

  .preview-block{
    margin-top: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,.18);
    overflow: hidden;
  }
  .preview-head{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
    border-bottom: 1px solid var(--line-soft);
  }
  .preview-head span:last-child{ font-family: var(--mono); letter-spacing: 0; color: #9fd9f5; }
  .preview-frame{
    max-height: 224px;
    overflow-y: auto;
    padding: 12px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,0) 40%),
      linear-gradient(180deg,#1b2430,#10161d);
  }
  .preview-grid{
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    gap: 3px;
  }
  .preview-cell{
    height: 22px;
    min-width: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.09);
    background: #232c37;
    color: #8fa3b6;
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }
  .preview-cell.state-normal{ border-color: rgba(45,212,160,.4); background: rgba(45,212,160,.14); color: #7ee7c3; }
  .preview-cell.state-low{ border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.15); color: #fcd34d; }
  .preview-cell.state-out{ border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.16); color: #fca5a5; }
  .preview-cell.state-empty{ border-style: dashed; color: #6b7a89; }
  .preview-grid.dense .preview-cell{ font-size: 6.5px; }
  .preview-gap{ height: 22px; }
  .preview-note{
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--line-soft);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .preview-note b{ font-family: var(--mono); color: #a5e3ff; font-weight: 600; }
  .preview-note .warn{ color: #fbbf24; }

  /* ============================================================
     3.5 区域侧边栏（zones）
     ============================================================ */
  .zones-panel{
    position: fixed; left: 0; top: 0; bottom: 0;
    z-index: 50;
    width: 220px;
    display: flex; flex-direction: column;
    padding: 10px 8px;
    background: #0e141b;
    border-right: 1px solid var(--line-soft);
    transition: width .18s ease;
  }
  body.zones-collapsed .zones-panel{ width: 64px; }
  .zones-head{
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 2px 4px 8px;
  }
  .zones-kicker{ font-size: 9px; letter-spacing: .16em; color: var(--muted-2); }
  .zones-title h2{ margin: 1px 0 0; font-size: 13px; letter-spacing: .04em; }
  .zones-toggle{
    width: 26px; height: 26px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 12px; cursor: pointer;
  }
  .zones-toggle:hover{ color: var(--text); border-color: rgba(56,189,248,.45); }
  .zones-scroll{ flex: 1; min-height: 0; overflow-y: auto; padding: 0; }
  .zones-list{ display: flex; flex-direction: column; gap: 4px; }
  .zone-item{
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 7px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.05);
    background: rgba(255,255,255,.02);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .zone-item:hover{ background: rgba(56,189,248,.06); border-color: rgba(56,189,248,.22); }
  .zone-item.active{
    background: rgba(56,189,248,.09);
    border-color: rgba(56,189,248,.30);
    box-shadow: inset 3px 0 0 #38bdf8;
  }
  .zone-item:focus-visible{ outline: 2px solid rgba(56,189,248,.75); outline-offset: 1px; }
  .zone-mark{
    width: 24px; height: 24px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    border: 1px solid rgba(56,189,248,.22);
    background: rgba(56,189,248,.10);
    color: #9fd9f5;
    font-size: 11px; font-weight: 700;
  }
  .zone-item.active .zone-mark{ background: rgba(56,189,248,.20); color: #e6f7ff; }
  .zone-body{ flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .zone-name{ font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-meta{ font-family: var(--mono); font-size: 9.5px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-tools{ flex: none; display: flex; gap: 1px; opacity: 0; transition: opacity .15s; }
  .zone-item:hover .zone-tools, .zone-item:focus-within .zone-tools{ opacity: 1; }
  .zone-act{
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 4px;
    border: 1px solid transparent;
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 10px; line-height: 1; cursor: pointer;
  }
  .zone-act:hover{ color: #bfe9ff; border-color: rgba(56,189,248,.35); }
  .zone-act:disabled{ opacity: .3; cursor: not-allowed; }
  .zones-foot{ flex: none; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
  .zones-foot .btn{ width: 100%; }
  .zones-tip{ font-size: 9.5px; color: var(--muted-2); text-align: center; }
  .zones-scrim{
    position: fixed; inset: 0; z-index: 60;
    display: none;
    background: rgba(3,7,12,.62);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .zones-scrim.show{ display: block; }
  body.zones-collapsed .zones-title,
  body.zones-collapsed .zone-body,
  body.zones-collapsed .zone-tools,
  body.zones-collapsed .zones-tip,
  body.zones-collapsed .zone-add-text{ display: none; }
  body.zones-collapsed .zones-head{ justify-content: center; padding: 2px 0 10px; }
  body.zones-collapsed .zone-item{ justify-content: center; padding: 7px; }
  body.zones-collapsed .zone-mark{ width: 32px; height: 32px; }
  body.zones-collapsed .zones-foot .btn{ padding: 0; height: 36px; font-size: 16px; }

  /* 跨区域搜索 */
  .cross-toggle{
    height: 32px; flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 0 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 11.5px; white-space: nowrap; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .cross-toggle input{ width: 13px; height: 13px; margin: 0; accent-color: #38bdf8; }
  .cross-toggle.on{ color: #bfe9ff; border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.1); }

  /* 区域编辑器底部操作区 */
  .modal-foot.split{ justify-content: space-between; }
  .foot-left, .foot-right{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .foot-left[hidden]{ display: none; }
  .preview-cell.restore{ box-shadow: inset 0 0 0 1px rgba(56,189,248,.7); }

  .toasts{
    position: fixed;
    left: 50%; bottom: 24px;
    z-index: 90;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
    width: max-content;
    max-width: calc(100vw - 32px);
  }
  .toast{
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(22,30,39,.97);
    border: 1px solid rgba(255,255,255,.14);
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    box-shadow: 0 16px 40px -14px #000;
    animation: toastIn .22s ease-out;
    max-width: 100%;
  }
  .toast.ok{ border-color: rgba(45,212,160,.45); }
  .toast.warn{ border-color: rgba(245,158,11,.5); }
  .toast.err{ border-color: rgba(239,68,68,.55); }
  @keyframes toastIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }

  /* ============================================================
     5. 响应式
     ============================================================ */
  @media (max-width: 1180px){
    .stat{ padding: 0 8px; }
    .brand-meta{ max-width: 150px; }
  }
  @media (max-width: 860px){
    body, body.zones-collapsed{ padding-left: 56px; }
    .zones-panel, body.zones-collapsed .zones-panel{ width: 56px; padding: 8px 5px; }
    .zones-panel .zones-title,
    .zones-panel .zone-body,
    .zones-panel .zone-tools,
    .zones-panel .zones-tip,
    .zones-panel .zone-add-text{ display: none; }
    .zones-panel .zones-head{ justify-content: center; }
    .zones-panel .zone-item{ justify-content: center; padding: 6px; }
    .zones-panel .zone-mark{ width: 32px; height: 32px; }
    .zones-panel .zones-foot .btn{ padding: 0; height: 36px; font-size: 16px; }
    .zones-panel.mobile-open{
      width: min(272px, 86vw);
      z-index: 70;
      padding: 12px 10px;
      box-shadow: 20px 0 60px -20px #000;
    }
    .zones-panel.mobile-open .zones-title,
    .zones-panel.mobile-open .zones-tip{ display: block; }
    .zones-panel.mobile-open .zone-body{ display: flex; }
    .zones-panel.mobile-open .zone-tools{ display: flex; opacity: 1; }
    .zones-panel.mobile-open .zone-add-text{ display: inline; }
    .zones-panel.mobile-open .zones-head{ justify-content: space-between; }
    .zones-panel.mobile-open .zone-item{ justify-content: flex-start; padding: 8px; }
    .zones-panel.mobile-open .zone-mark{ width: 30px; height: 30px; }
    .zones-panel.mobile-open .zones-foot .btn{ padding: 0 13px; height: 40px; font-size: 13px; }
  }
  @media (max-width: 720px){
    /* 窄屏：顶栏换行成两行，功能一个不丢 */
    .topbar{ height: auto; padding: 0 10px; }
    .topbar-inner{ flex-wrap: wrap; padding: 6px 0; gap: 6px 8px; }
    .brand{ flex: 1 1 auto; }
    .stats{ display: none; }
    .tool-row{ width: 100%; margin-left: 0; flex-wrap: wrap; gap: 6px; }
    .search-wrap{ order: 1; flex: 1 1 100%; max-width: none; }
    .cross-toggle{ order: 2; }
    .zoom-ctl{ order: 3; }
    .actions{ order: 4; margin-left: auto; }
    .search-hint{ font-size: 11px; }
    .stage{ padding: 6px 6px 4px; }
    .cell{ min-height: 92px; padding: 8px 8px 7px 12px; border-radius: 6px; }
    .cell::before{ border-radius: 6px 0 0 6px; width: 3px; }
    .cell-id{ font-size: 9px; padding: 2px 4px; }
    .cell-tag{ font-size: 8.5px; padding: 1px 5px; }
    .cell-main{ margin-top: 5px; }
    .cell-name{ font-size: 11.5px; line-height: 1.3; }
    .cell-model{ font-size: 9px; }
    .cell-foot{ margin-top: 6px; }
    .cell-qty{ font-size: 15px; }
    .cell-qty em{ font-size: 8.5px; }
    .cell-state-text{ font-size: 8.5px; }
    .cell-level{ margin-top: 6px; }
    .cell-empty{ font-size: 10px; gap: 4px; }
    .cell-empty svg{ width: 13px; height: 13px; }
    .legend{ gap: 12px; font-size: 11px; }

    .modal{ max-height: 92vh; border-radius: 16px; }
    .modal.layout-modal{ width: 100%; }
    .modal-head{ padding: 16px 16px 10px; }
    .modal-body{ padding: 4px 16px 2px; }
    .modal-foot{ padding: 12px 16px 16px; }
    .row-editor{ max-height: 150px; }
    .preview-frame{ max-height: 190px; padding: 8px; }
    .preview-cell{ height: 19px; }
    .preview-gap{ height: 19px; }

    .drawer{
      top: auto; left: 0; right: 0; bottom: 0;
      width: auto;
      max-height: 90vh;
      border-left: 0;
      border-top: 1px solid var(--line);
      border-radius: 10px 10px 0 0;
      transform: translateY(105%);
      box-shadow: 0 -30px 80px -30px rgba(0,0,0,.95);
    }
    .drawer.open{ transform: translateY(0); }
    .drawer-grip{
      display: block;
      width: 44px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,.22);
      margin: 8px auto 0;
    }
    .drawer-head{ padding: 8px 16px 12px; }
    .drawer-head h2{ font-size: 22px; }
    .drawer-body{ padding: 14px 16px; }
    .drawer-foot{ padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .drawer-foot .btn{ height: 44px; }
    .toasts{ bottom: 16px; }
  }
  @media (max-width: 400px){
    .brand-name{ font-size: 13px; }
    .brand-meta{ display: none; }
    .legend{ gap: 10px; }
    .field-row{ grid-template-columns: 1fr; gap: 0; }
    .stepper .unit-input{ width: 54px; }
  }
  /* ============================================================
     5.5 柜体铺满 + 等比格 + 均匀间距 + 行标 / 列标（sticky）
     ============================================================ */
  /* 主舞台纵向铺满：顶栏 / 舞台 / 页脚用 flex 分配，柜内滚动代替页面滚动 */
  .topbar{ flex: 0 0 auto; }
  .stage{
    flex: 1 1 auto; min-height: 0;
    max-width: none; margin: 0;
    padding: 8px 12px 6px;
    display: flex; flex-direction: column;
  }
  .cabinet{ flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .legend{ flex: 0 0 auto; margin-top: 6px; }

  .cabinet-inner{
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    --rlabel: 32px;
    --clabel: 22px;
    --cell-gap-x: 12px;
    --cell-gap-y: 12px;
  }
  /* 左侧行标列 + 顶部列标行；格子尺寸 / 间距由 applyZoom 写入变量 */
  .cabinet-inner .grid{
    /* 让 grid 盒宽度与轨道总宽一致，否则 sticky 会被 100% 宽的容器裁住 */
    width: max-content;
    grid-template-columns: var(--rlabel) repeat(var(--cols, 4), var(--cell-w, 96px));
    grid-template-rows: var(--clabel);
    grid-auto-rows: var(--cell-h, 88px);
    gap: var(--cell-gap-y) var(--cell-gap-x);
    justify-content: start;
    align-content: start;
  }
  /* 行高由轨道决定，格子本身不能再被 min-height 撑开 */
  .cabinet-inner .cell{ min-height: 0; overflow: hidden; }

  /* 行标 A/B/C…、列标 1/2/3…：滚动时常驻 */
  .axis-label{
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    letter-spacing: .02em;
    color: var(--muted);
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 4px;
    user-select: none;
  }
  .axis-col{ position: sticky; top: 0; z-index: 4; }
  .axis-row{ position: sticky; left: 0; z-index: 3; font-size: 13px; }
  .axis-corner{
    position: sticky; top: 0; left: 0; z-index: 5;
    background: var(--bg);
    border: 0;
  }
  /* 选中格 / 命中格所在的行列同步高亮 */
  .axis-label.hit{
    background: rgba(245,158,11,.16);
    border-color: rgba(245,158,11,.55);
    color: #fbbf24;
  }

  /* ---------- 信息分级：120×110 为完整档，触底后逐级降级 ---------- */
  .cabinet-inner[data-band="lg"] .cell{ padding: 9px 9px 8px 14px; }
  .cabinet-inner[data-band="lg"] .cell-id{ font-size: 10px; padding: 2px 5px; }
  .cabinet-inner[data-band="lg"] .cell-tag{ font-size: 9px; padding: 1px 6px; }
  .cabinet-inner[data-band="lg"] .cell-main{ margin-top: 5px; }
  .cabinet-inner[data-band="lg"] .cell-name{ font-size: 12.5px; line-height: 1.28; }
  .cabinet-inner[data-band="lg"] .cell-model{ margin-top: 2px; font-size: 9.5px; }
  .cabinet-inner[data-band="lg"] .cell-foot{ margin-top: 5px; }
  .cabinet-inner[data-band="lg"] .cell-qty{ font-size: 16px; }
  .cabinet-inner[data-band="lg"] .cell-level{ margin-top: 5px; }

  .cabinet-inner[data-band="md"] .cell{ padding: 8px 8px 7px 12px; }
  .cabinet-inner[data-band="md"] .cell-tag{ display: none; }
  .cabinet-inner[data-band="md"] .cell-model{ display: none; }
  .cabinet-inner[data-band="md"] .cell-main{ margin-top: 5px; }
  .cabinet-inner[data-band="md"] .cell-name{ font-size: 12.5px; }
  .cabinet-inner[data-band="md"] .cell-foot{ margin-top: 5px; }
  .cabinet-inner[data-band="md"] .cell-qty{ font-size: 16px; }
  .cabinet-inner[data-band="md"] .cell-level{ margin-top: 5px; }

  .cabinet-inner[data-band="sm"] .cell{ padding: 6px 7px 6px 10px; }
  .cabinet-inner[data-band="sm"] .cell-tag,
  .cabinet-inner[data-band="sm"] .cell-model,
  .cabinet-inner[data-band="sm"] .cell-empty{ display: none; }
  .cabinet-inner[data-band="sm"] .cell-id{ font-size: 9px; padding: 1px 4px; }
  .cabinet-inner[data-band="sm"] .cell-main{ margin-top: 2px; }
  .cabinet-inner[data-band="sm"] .cell-name{
    font-size: 11.5px; line-height: 1.25;
    -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cabinet-inner[data-band="sm"] .cell-foot{ margin-top: 2px; }
  .cabinet-inner[data-band="sm"] .cell-qty{ font-size: 14px; }

<script>
/* ================================================================
   PCB 物料柜 · 数据层 / 视图层 / 交互层分离的单文件实现
   - Store  ：柜体与格位数据、localStorage 持久化、导入导出校验
   - View   ：纯渲染，不直接读写 localStorage
   - Actions：交互编排（抽屉、搜索、设置、导入导出）
   扩展硬件（电子锁 / 扫码枪）时，只需在 Actions 中调用
   window.MaterialCabinet.onCellChanged 或替换 Store 的持久化实现。
   ================================================================ */
(function () {
  'use strict';

  /* ---------------- 1. 常量 ---------------- */
  const STORAGE_KEY = 'pcb-material-cabinet.v1';
  const APP_ID = 'pcb-material-cabinet';
  const VERSION = 2;
  const ROWS_MAX = 26;
  const COLS_MAX = 15;
  const TOTAL_MAX = ROWS_MAX * COLS_MAX;
  const ZOOM_KEY = 'pcb-material-cabinet.zoom.v1';
  const CATEGORIES = ['电阻', '电容', '电感', '连接器', 'IC', '二极管', '晶体管', '晶振', '其他'];
  const STATUS_TEXT = { empty: '空位', normal: '正常', low: '低库存', out: '缺料' };

  /* ---------------- 2. 工具函数 ---------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const clampInt = (v, min, max, def) => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
  };
  const round2 = (n) => Math.round(n * 100) / 100;
  const parseQty = (v, def) => {
    const n = Number(String(v == null ? '' : v).replace(',', '.'));
    return Number.isFinite(n) && n >= 0 ? round2(n) : def;
  };
  const fmtNum = (n) => Number(n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtTime = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };
  const rowLetter = (r) => String.fromCharCode(65 + r);
  const labelAt = (r, c) => rowLetter(r) + String(c + 1);
  const totalOf = (counts) => counts.reduce((a, b) => a + b, 0);
  const maxColsOf = (counts) => counts.reduce((m, n) => Math.max(m, n), 0);
  const isUniform = (counts) => counts.every((n) => n === counts[0]);
  const distribute = (total, rows) => {
    const base = Math.floor(total / rows);
    const rem = total % rows;
    return Array.from({ length: rows }, (_, i) => base + (i < rem ? 1 : 0));
  };
  /* 自动排布：先按接近斐波那契比例的矩形估算排数，再受 26 排 / 12 列上限约束 */
  const autoRowCounts = (total) => {
    let rows = Math.floor(Math.sqrt(total * 1.5) + 0.5);
    rows = Math.min(ROWS_MAX, Math.max(1, rows));
    if (Math.ceil(total / rows) > COLS_MAX) rows = Math.ceil(total / COLS_MAX);
    rows = Math.min(ROWS_MAX, Math.max(1, rows));
    while (rows < ROWS_MAX && Math.ceil(total / rows) > COLS_MAX) rows++;
    return distribute(total, rows);
  };
  const normalizeCell = (raw) => {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const name = String(raw.name == null ? '' : raw.name).trim();
    if (!name) return null;
    return {
      name: name.slice(0, 40),
      category: CATEGORIES.indexOf(raw.category) >= 0 ? raw.category : '其他',
      model: String(raw.model == null ? '' : raw.model).trim().slice(0, 40),
      qty: Number.isFinite(Number(raw.qty)) && Number(raw.qty) >= 0 ? round2(Number(raw.qty)) : 0,
      unit: (String(raw.unit == null ? '' : raw.unit).trim() || 'pcs').slice(0, 6),
      minQty: Number.isFinite(Number(raw.minQty)) && Number(raw.minQty) >= 0 ? round2(Number(raw.minQty)) : 0,
      note: String(raw.note == null ? '' : raw.note).trim().slice(0, 120),
      updatedAt: (typeof raw.updatedAt === 'string' && !isNaN(Date.parse(raw.updatedAt))
        ? raw.updatedAt : new Date().toISOString())
    };
  };
  const cellStatus = (cell) => {
    if (!cell || !cell.name) return 'empty';
    if (!(Number(cell.qty) > 0)) return 'out';
    if (Number(cell.minQty) > 0 && Number(cell.qty) < Number(cell.minQty)) return 'low';
    return 'normal';
  };
  const labelRe = /^[A-Z][1-9][0-9]?$/;

  /* ---------------- 3. 区域工具与数据层 ---------------- */
  let uidSeq = 0;
  const uid = () => 'z' + Date.now().toString(36) + (++uidSeq).toString(36) + Math.random().toString(36).slice(2, 5);
  const absorbCells = (src, dest) => {
    if (!src || typeof src !== 'object' || Array.isArray(src)) return;
    Object.keys(src).forEach((id) => {
      if (!labelRe.test(id)) return;
      const cell = normalizeCell(src[id]);
      if (cell) dest[id] = cell;
    });
  };
  const normalizeZone = (raw) => {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    let rowCounts;
    if (Array.isArray(raw.rowCounts) && raw.rowCounts.length) {
      rowCounts = raw.rowCounts.slice(0, ROWS_MAX).map((n) => clampInt(n, 1, COLS_MAX, 4));
    } else {
      const rows = clampInt(raw.rows, 1, ROWS_MAX, 6);
      rowCounts = new Array(rows).fill(clampInt(raw.cols, 1, COLS_MAX, 4));
    }
    if (!rowCounts.length) rowCounts = [4];
    const name = (typeof raw.name === 'string' && raw.name.trim())
      ? raw.name.trim().slice(0, 30)
      : '物料柜';
    const cells = {};
    const hidden = {};
    absorbCells(raw.cells, cells);
    absorbCells(raw.hidden, hidden);
    const valid = new Set();
    rowCounts.forEach((n, r) => {
      for (let c = 0; c < n; c++) valid.add(labelAt(r, c));
    });
    Object.keys(cells).forEach((id) => {
      if (!valid.has(id)) {
        hidden[id] = cells[id];
        delete cells[id];
      }
    });
    Object.keys(hidden).forEach((id) => {
      if (valid.has(id) && !cells[id]) {
        cells[id] = hidden[id];
        delete hidden[id];
      }
    });
    const layoutMode = (raw.layoutMode === 'total' || raw.layoutMode === 'custom')
      ? raw.layoutMode
      : (isUniform(rowCounts) ? 'total' : 'custom');
    const idOk = typeof raw.id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(raw.id);
    return {
      id: idOk ? raw.id : uid(),
      name,
      note: String(raw.note == null ? '' : raw.note).trim().slice(0, 80),
      location: String(raw.location == null ? '' : raw.location).trim().slice(0, 60),
      rowCounts, layoutMode, cells, hidden
    };
  };
  const makeZone = (input) => normalizeZone(Object.assign({}, input || {}, {
    id: uid(),
    cells: (input && input.cells) || {},
    hidden: (input && input.hidden) || {}
  }));

  const Store = {
    state: null,

    get zone() {
      const zones = this.state.zones;
      return zones.find((z) => z.id === this.state.activeZoneId) || zones[0];
    },

    zoneById(id) { return this.state.zones.find((z) => z.id === id) || null; },

    labels() {
      const out = [];
      this.zone.rowCounts.forEach((n, r) => {
        for (let c = 0; c < n; c++) out.push(labelAt(r, c));
      });
      return out;
    },

    inRange(id) {
      if (!labelRe.test(id)) return false;
      const counts = this.zone.rowCounts;
      const r = id.charCodeAt(0) - 65;
      const c = parseInt(id.slice(1), 10) - 1;
      return r >= 0 && r < counts.length && c >= 0 && c < counts[r];
    },

    load() {
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (err) { /* 隐私模式 / file:// 限制 */ }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && (Array.isArray(parsed.zones) || (parsed.cabinet && parsed.cells))) {
            this.state = this.normalize(parsed);
            return false;
          }
        } catch (err) {
          console.warn('[物料柜] 本地数据损坏，已回退到示例数据', err);
        }
      }
      this.state = this.seed();
      this.persist();
      return true;
    },

    normalize(data) {
      const src = data || {};
      let zones = [];
      if (Array.isArray(src.zones)) {
        zones = src.zones.map((z) => normalizeZone(z)).filter(Boolean);
      } else if (src.cabinet || src.cells) {
        /* 兼容旧版单柜体：自动折成一个区域 */
        const cab = src.cabinet || {};
        zones = [normalizeZone({
          id: 'z1',
          name: cab.name,
          rows: cab.rows,
          cols: cab.cols,
          rowCounts: cab.rowCounts,
          layoutMode: cab.layoutMode,
          cells: src.cells,
          hidden: src.hidden
        })].filter(Boolean);
      }
      if (!zones.length) {
        zones = [makeZone({ name: 'PCB 物料柜 · A 区', rowCounts: [4, 4, 4, 4, 4, 4], layoutMode: 'total' })];
      }
      const seen = new Set();
      zones.forEach((z) => {
        if (seen.has(z.id)) z.id = uid();
        seen.add(z.id);
      });
      const active = zones.find((z) => z.id === src.activeZoneId) ? src.activeZoneId : zones[0].id;
      return { zones, activeZoneId: active };
    },

    persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          app: APP_ID,
          version: VERSION,
          activeZoneId: this.state.activeZoneId,
          zones: this.state.zones
        }));
        return true;
      } catch (err) {
        console.warn('[物料柜] 写入本地存储失败', err);
        return false;
      }
    },

    },

    getCell(id) { return this.zone.cells[id] || null; },

    setCell(id, cell) {
      if (!labelRe.test(id)) return;
      this.zone.cells[id] = cell;
      delete this.zone.hidden[id];
      this.persist();
    },

    clearCell(id) {
      delete this.zone.cells[id];
      this.persist();
    },

    setActiveZone(id) {
      if (!this.zoneById(id)) return false;
      this.state.activeZoneId = id;
      this.persist();
      return true;
    },

    addZone(input) {
      const zone = makeZone(input);
      this.state.zones.push(zone);
      this.state.activeZoneId = zone.id;
      this.persist();
      return zone;
    },

    updateZone(id, input) {
      const zone = this.zoneById(id);
      if (!zone) return null;
      const prev = new Set(this.zoneLabels(zone));
      zone.name = input.name;
      if (input.note != null) zone.note = input.note;
      if (input.location != null) zone.location = input.location;
      zone.rowCounts = input.rowCounts.slice();
      zone.layoutMode = input.layoutMode === 'total' ? 'total' : 'custom';
      const next = new Set(this.zoneLabels(zone));
      let added = 0;
      next.forEach((label) => { if (!prev.has(label)) added++; });
      let stashed = 0;
      let restored = 0;
      Object.keys(zone.cells).forEach((label) => {
        if (!next.has(label)) {
          zone.hidden[label] = zone.cells[label];
          delete zone.cells[label];
          stashed++;
        }
      });
      Object.keys(zone.hidden).forEach((label) => {
        if (next.has(label)) {
          zone.cells[label] = zone.hidden[label];
          delete zone.hidden[label];
          restored++;
        }
      });
      this.persist();
      return { added, stashed, restored, total: next.size, rows: zone.rowCounts.length };
    },

    removeZone(id) {
      const zones = this.state.zones;
      if (zones.length <= 1) return false;
      const idx = zones.findIndex((z) => z.id === id);
      if (idx < 0) return false;
      zones.splice(idx, 1);
      if (this.state.activeZoneId === id) {
        this.state.activeZoneId = zones[Math.min(idx, zones.length - 1)].id;
      }
      this.persist();
      return true;
    },

    copyZone(id) {
      const src = this.zoneById(id);
      if (!src) return null;
      const copy = makeZone({
        name: (src.name + ' 副本').slice(0, 30),
        note: src.note,
        location: src.location,
        layoutMode: src.layoutMode,
        rowCounts: src.rowCounts.slice(),
        cells: JSON.parse(JSON.stringify(src.cells)),
        hidden: JSON.parse(JSON.stringify(src.hidden))
      });
      const idx = this.state.zones.findIndex((z) => z.id === id);
      this.state.zones.splice(idx + 1, 0, copy);
      this.state.activeZoneId = copy.id;
      this.persist();
      return copy;
    },

    moveZone(id, dir) {
      const zones = this.state.zones;
      const idx = zones.findIndex((z) => z.id === id);
      const to = idx + dir;
      if (idx < 0 || to < 0 || to >= zones.length) return false;
      const tmp = zones[idx];
      zones[idx] = zones[to];
      zones[to] = tmp;
      this.persist();
      return true;
    },

    zoneLabels(zone) {
      const out = [];
      zone.rowCounts.forEach((n, r) => {
        for (let c = 0; c < n; c++) out.push(labelAt(r, c));
      });
      return out;
    },

    zoneStats(zone) {
      const z = zone || this.zone;
      let used = 0; let low = 0; let out = 0; let sum = 0;
      z.rowCounts.forEach((n, r) => {
        for (let c = 0; c < n; c++) {
          const cell = z.cells[labelAt(r, c)];
          if (!cell) continue;
          used++;
          const st = cellStatus(cell);
          if (st === 'low') low++;
          if (st === 'out') out++;
          sum += Number(cell.qty) || 0;
        }
      });
      return { total: totalOf(z.rowCounts), used, low, out, sum };
    },

    stats() { return this.zoneStats(); },

    search(query) {
      const q = String(query == null ? '' : query).trim().toLowerCase();
      if (!q) return [];
      const z = this.zone;
      const hits = [];
      this.zoneLabels(z).forEach((id) => {
        const cell = z.cells[id];
        if (!cell) return;
        const hay = [cell.name, cell.model, cell.category, cell.note].join(' ').toLowerCase();
        if (hay.indexOf(q) >= 0) hits.push({ id, cell });
      });
      return hits;
    },

    searchAll(query) {
      const q = String(query == null ? '' : query).trim().toLowerCase();
      if (!q) return [];
      const hits = [];
      this.state.zones.forEach((z) => {
        this.zoneLabels(z).forEach((id) => {
          const cell = z.cells[id];
          if (!cell) return;
          const hay = [cell.name, cell.model, cell.category, cell.note].join(' ').toLowerCase();
          if (hay.indexOf(q) >= 0) hits.push({ zoneId: z.id, zoneName: z.name, id, cell });
        });
      });
      return hits;
    },

    backup() {
      return {
        app: APP_ID,
        version: VERSION,
        exportedAt: new Date().toISOString(),
        activeZoneId: this.state.activeZoneId,
        zones: this.state.zones.map((z) => ({
          id: z.id,
          name: z.name,
          note: z.note,
          location: z.location,
          layoutMode: z.layoutMode,
          rowCounts: z.rowCounts.slice(),
          cells: Object.assign({}, z.cells),
          hidden: Object.assign({}, z.hidden)
        }))
      };
    },

    replaceState(data) {
      this.state = this.normalize(data);
      this.persist();
    }
  };

  /* ---------------- 4. 导入校验 ---------------- */
  function validateLayoutFields(obj, prefix) {
    if (Array.isArray(obj.rowCounts)) {
      if (!obj.rowCounts.length || obj.rowCounts.length > ROWS_MAX) {
        throw new Error(prefix + '排数无效（应为 1–' + ROWS_MAX + ' 排）');
      }
      obj.rowCounts.forEach((n, i) => {
        if (!Number.isInteger(n) || n < 1 || n > COLS_MAX) {
          throw new Error(prefix + '第 ' + (i + 1) + ' 排格数无效（应为 1–' + COLS_MAX + ' 的整数）');
        }
      });
    } else {
      /* 兼容旧版：仅有 rows / cols */
      const rows = Number(obj.rows);
      const cols = Number(obj.cols);
      if (!Number.isInteger(rows) || rows < 1 || rows > ROWS_MAX) {
        throw new Error(prefix + '行数无效（应为 1–' + ROWS_MAX + ' 的整数）');
      }
      if (!Number.isInteger(cols) || cols < 1 || cols > COLS_MAX) {
        throw new Error(prefix + '列数无效（应为 1–' + COLS_MAX + ' 的整数）');
      }
    }
    if (obj.layoutMode != null && obj.layoutMode !== 'total' && obj.layoutMode !== 'custom') {
      throw new Error(prefix + '布局模式无效');
    }
    ['name', 'note', 'location'].forEach((k) => {
      if (obj[k] != null && typeof obj[k] !== 'string') throw new Error(prefix + k + ' 字段格式不正确');
    });
  }

  function validateCells(cells, prefix) {
    if (!cells || typeof cells !== 'object' || Array.isArray(cells)) {
      throw new Error(prefix + '缺少 cells 格位数据');
    }
    const keys = Object.keys(cells);
    if (keys.length > TOTAL_MAX) throw new Error(prefix + '格位数量异常（超过 ' + TOTAL_MAX + ' 条）');
    keys.forEach((id) => {
      if (!labelRe.test(id)) throw new Error(prefix + '格位编号 “' + id + '” 格式不正确');
      const cell = cells[id];
      if (!cell || typeof cell !== 'object' || Array.isArray(cell)) throw new Error(prefix + '格位 ' + id + ' 的数据格式不正确');
      if (typeof cell.name !== 'string' || !cell.name.trim()) throw new Error(prefix + '格位 ' + id + ' 缺少物料名称');
      if (typeof cell.qty !== 'number' || !isFinite(cell.qty) || cell.qty < 0) throw new Error(prefix + '格位 ' + id + ' 的数量无效');
      if (cell.minQty != null && (typeof cell.minQty !== 'number' || !isFinite(cell.minQty) || cell.minQty < 0)) {
        throw new Error(prefix + '格位 ' + id + ' 的预警数量无效');
      }
      ['model', 'category', 'unit', 'note'].forEach((k) => {
        if (cell[k] != null && typeof cell[k] !== 'string') throw new Error(prefix + '格位 ' + id + ' 的 ' + k + ' 字段格式不正确');
      });
    });
  }

  function validateBackup(data) {
    const fail = (msg) => { throw new Error(msg); };
    if (!data || typeof data !== 'object' || Array.isArray(data)) fail('文件内容不是有效的 JSON 对象');
    if (Array.isArray(data.zones)) {
      if (!data.zones.length) fail('zones 区域列表为空');
      if (data.zones.length > 50) fail('区域数量异常（超过 50 个）');
      data.zones.forEach((z, i) => {
        const prefix = '第 ' + (i + 1) + ' 个区域：';
        if (!z || typeof z !== 'object' || Array.isArray(z)) fail(prefix + '格式不正确');
        validateLayoutFields(z, prefix);
        validateCells(z.cells, prefix);
        if (z.hidden != null && (typeof z.hidden !== 'object' || Array.isArray(z.hidden))) {
          fail(prefix + 'hidden 暂存数据格式不正确');
        }
      });
      if (data.activeZoneId != null && typeof data.activeZoneId !== 'string') fail('activeZoneId 格式不正确');
      return true;
    }

    /* 兼容旧版单柜体备份 */
    const cab = data.cabinet;
    if (!cab || typeof cab !== 'object' || Array.isArray(cab)) fail('缺少 zones 区域列表或 cabinet 柜体信息');
    validateLayoutFields(cab, '');
    validateCells(data.cells, '');
    if (data.hidden != null && (typeof data.hidden !== 'object' || Array.isArray(data.hidden))) {
      fail('hidden 暂存数据格式不正确');
    }
    return true;
  }

  function cellNode(id, cell) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.id = id;
    const status = cellStatus(cell);
    btn.className = 'cell state-' + status;

    if (!cell) {
      btn.setAttribute('aria-label', id + ' 空位，点击入库');
      btn.title = id + ' · 空位';

        '<span class="cell-top"><span class="cell-id">' + id + '</span><span class="cell-tag">空位</span></span>' +

        '<span class="cell-level"><i style="width:0"></i></span>';
      return btn;
    }

    const qty = Number(cell.qty) || 0;
    const basis = Number(cell.minQty) > 0 ? Number(cell.minQty) : Math.max(qty, 1);
    const ratio = Math.round(Math.min(1, qty / (basis * 2)) * 100);
    const stateText = status === 'low' ? '低库存' : status === 'out' ? '缺料' : '';

    btn.setAttribute('aria-label',
      id + ' ' + cell.name + '，剩余 ' + fmtNum(qty) + ' ' + cell.unit + '，状态 ' + STATUS_TEXT[status] + '，点击查看');
